<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05060d" />
    <title>NEON RUSH · 3D 赛车</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>

      <!-- ================= HUD ================= -->
      <div id="hud" class="hidden">
        <!-- 左上：圈数 / 计时 -->
        <div class="hud-block hud-tl">
          <div class="panel">
            <div class="row">
              <span class="label">LAP</span>
              <span id="hud-lap" class="value big">1/3</span>
            </div>
            <div class="row">
              <span class="label">TIME</span>
              <span id="hud-time" class="value mono">0:00.00</span>
            </div>
            <div class="row">
              <span class="label">BEST</span>
              <span id="hud-best" class="value mono dim">--:--.--</span>
            </div>
            <div id="hud-delta" class="delta"></div>
          </div>
        </div>

        <!-- 右上：名次 + 小地图 -->
        <div class="hud-block hud-tr">
          <div id="hud-pos" class="position"><b>1</b><span>/4</span></div>
          <canvas id="minimap" width="200" height="200"></canvas>
          <div id="hud-standings" class="standings"></div>
        </div>

        <!-- 左下：血条 / 战斗信息（竞技场模式） -->
        <div class="hud-block hud-bl">
          <div id="hud-health-wrap" class="health-wrap hidden">
            <div class="health-label">HULL</div>
            <div class="health-bar"><div id="hud-health" class="health-fill"></div></div>
            <div id="hud-score" class="score">KILLS 0 · LIVES 3</div>
          </div>
        </div>

        <!-- 右下：速度表 + 氮气 -->
        <div class="hud-block hud-br">
          <div class="speedo">
            <svg viewBox="0 0 200 200" width="100%" height="100%">
              <defs>
                <linearGradient id="spd-grad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#37f5d8" />
                  <stop offset="60%" stop-color="#ffd166" />
                  <stop offset="100%" stop-color="#ff3b6b" />
                </linearGradient>
              </defs>
              <circle class="spd-bg" cx="100" cy="100" r="82" />
              <circle id="spd-arc" class="spd-arc" cx="100" cy="100" r="82" />
              <g id="spd-ticks"></g>
            </svg>
            <div class="speed-readout">
              <div id="hud-speed" class="speed-num">0</div>
              <div class="speed-unit">KM/H</div>
              <div id="hud-gear" class="gear">N</div>
            </div>
          </div>
          <div class="nitro">
            <div class="nitro-label">NITRO</div>
            <div class="nitro-bar"><div id="hud-nitro" class="nitro-fill"></div></div>
          </div>
        </div>

        <!-- 居中提示 -->
        <div id="hud-center" class="center-msg"></div>
        <div id="hud-wrongway" class="wrongway hidden">◀ 方向错误 ▶</div>
        <div id="hud-toast" class="toast"></div>
      </div>

      <!-- ================= 移动端触摸控制 ================= -->
      <div id="touch" class="hidden">
        <div id="stick-zone" class="stick-zone">
          <div id="stick-base" class="stick-base"><div id="stick-knob" class="stick-knob"></div></div>
        </div>
        <div class="btn-zone">
          <button id="btn-nitro" class="tbtn nitro">NOS</button>
          <button id="btn-hand" class="tbtn hand">HAND</button>
          <button id="btn-cam" class="tbtn small">CAM</button>
          <button id="btn-reset" class="tbtn small">RESET</button>
        </div>
      </div>

      <!-- ================= 主菜单 ================= -->
      <div id="menu" class="overlay">
        <div class="menu-inner">
          <h1 class="title">NEON<span>RUSH</span></h1>
          <p class="subtitle">Three.js · Cannon-es · 第三人称 3D 赛车</p>

          <div class="section">
            <div class="section-title">游戏模式</div>
            <div class="modes">
              <button class="mode-card selected" data-mode="race">
                <b>单人竞速</b><i>VS 3 台 AI 对手 · 3 圈</i>
              </button>
              <button class="mode-card" data-mode="timetrial">
                <b>计时赛</b><i>幽灵车影子竞速 · 刷新最佳圈速</i>
              </button>
              <button class="mode-card" data-mode="arena">
                <b>竞技场战斗</b><i>撞击对抗 · 血量与拾取</i>
              </button>
            </div>
          </div>

          <div class="section two-col">
            <div>
              <div class="section-title">车辆颜色</div>
              <div id="color-picker" class="colors"></div>
            </div>
            <div>
              <div class="section-title">选项</div>
              <label class="opt"><input type="checkbox" id="opt-night" checked /> 昼夜循环</label>
              <label class="opt"><input type="checkbox" id="opt-weather" /> 随机天气</label>
              <label class="opt"><input type="checkbox" id="opt-sound" checked /> 引擎音效</label>
              <label class="opt"><input type="checkbox" id="opt-debug" /> 物理调试面板 (dat.gui)</label>
            </div>
          </div>

          <button id="btn-start" class="start-btn">开始游戏</button>

          <div class="controls-help">
            <b>键盘：</b>WASD / 方向键 驾驶 · 空格 手刹 · Shift 氮气 · C 切换视角 · R 复位 · Esc 暂停 · M 静音 · G 调试面板
          </div>

          <div id="build-stamp" class="build-stamp"></div>
        </div>
      </div>

      <!-- ================= 结算 ================= -->
      <div id="results" class="overlay hidden">
        <div class="menu-inner narrow">
          <h2 id="res-title" class="res-title">比赛结束</h2>
          <div id="res-body" class="res-body"></div>
          <div class="btn-row">
            <button id="btn-again" class="start-btn">再来一次</button>
            <button id="btn-menu" class="ghost-btn">返回菜单</button>
          </div>
        </div>
      </div>

      <!-- ================= 暂停 ================= -->
      <div id="pause" class="overlay hidden">
        <div class="menu-inner narrow">
          <h2 class="res-title">已暂停</h2>
          <div class="btn-row">
            <button id="btn-resume" class="start-btn">继续</button>
            <button id="btn-quit" class="ghost-btn">返回菜单</button>
          </div>
        </div>
      </div>

      <!-- ================= 加载 ================= -->
      <div id="loading" class="overlay">
        <div class="loader">
          <div class="spinner"></div>
          <div id="loading-text">正在构建赛道…</div>
        </div>
      </div>

      <div id="fps" class="fps hidden">0 FPS</div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
