function drawEmptyChart(cv, txt) {
  var q = prepCv(cv); var c = q.c, W = q.W, H = q.H;
  c.fillStyle = '#c3d5ea'; c.font = '10px system-ui'; c.textAlign = 'center';
  c.fillText(txt || '', W / 2, H / 2);
}

function drawXbar(cv, ch, p) {
  var q = prepCv(cv); var c = q.c, W = q.W, H = q.H;
  var pts = ch.pts;
  var x0 = 24, x1 = W - 5, y0 = 8, y1 = H - 12;
  if (!pts.length) { drawEmptyChart(cv, '等待首个子组…'); return; }

  var lo = Infinity, hi = -Infinity;
  for (var i = 0; i < pts.length; i++) { if (pts[i] < lo) lo = pts[i]; if (pts[i] > hi) hi = pts[i]; }
  if (ch.limits) {
    lo = Math.min(lo, ch.lcl); hi = Math.max(hi, ch.ucl);
  }
  /* 规格限也画进来：控制限(过程之声) 与 规格限(顾客之声) 的距离就是 CPK */
  var d = p.d;
  if (isFinite(d.usl)) hi = Math.max(hi, d.usl);
  if (isFinite(d.lsl)) lo = Math.min(lo, d.lsl);
  if (hi - lo < 1e-9) hi = lo + 1;
  var pad = (hi - lo) * 0.14; lo -= pad; hi += pad;

  var n = Math.max(pts.length, 12);
  var X = function (i2) { return x0 + (x1 - x0) * (i2 / Math.max(1, n - 1)); };
  var Y = function (v) { return y1 - (y1 - y0) * (v - lo) / (hi - lo); };

  /* 规格带 */
  if (isFinite(d.usl)) {
    c.fillStyle = 'rgba(239,68,68,.07)';
    c.fillRect(x0, y0, x1 - x0, Math.max(0, Y(d.usl) - y0));
    c.strokeStyle = 'rgba(239,68,68,.55)'; c.lineWidth = 1; c.setLineDash([4, 3]);
    c.beginPath(); c.moveTo(x0, Y(d.usl)); c.lineTo(x1, Y(d.usl)); c.stroke(); c.setLineDash([]);
  }
  if (isFinite(d.lsl)) {
    c.fillStyle = 'rgba(239,68,68,.07)';
    c.fillRect(x0, Y(d.lsl), x1 - x0, Math.max(0, y1 - Y(d.lsl)));
    c.strokeStyle = 'rgba(239,68,68,.55)'; c.lineWidth = 1; c.setLineDash([4, 3]);
    c.beginPath(); c.moveTo(x0, Y(d.lsl)); c.lineTo(x1, Y(d.lsl)); c.stroke(); c.setLineDash([]);
  }

  /* 控制限 */
  if (ch.limits) {
    c.strokeStyle = 'rgba(245,158,11,.9)'; c.lineWidth = 1;
    [ch.ucl, ch.lcl].forEach(function (v) {
      c.beginPath(); c.moveTo(x0, Y(v)); c.lineTo(x1, Y(v)); c.stroke();
    });
    c.strokeStyle = 'rgba(18,185,129,.9)';
    c.beginPath(); c.moveTo(x0, Y(ch.cl)); c.lineTo(x1, Y(ch.cl)); c.stroke();
    /* ±1σ / ±2σ 分区（Nelson 判异用） */
    var sg = (ch.ucl - ch.cl) / 3;
    c.strokeStyle = 'rgba(30,136,255,.16)';
    for (var z = 1; z <= 2; z++) {
      c.beginPath(); c.moveTo(x0, Y(ch.cl + sg * z)); c.lineTo(x1, Y(ch.cl + sg * z)); c.stroke();
      c.beginPath(); c.moveTo(x0, Y(ch.cl - sg * z)); c.lineTo(x1, Y(ch.cl - sg * z)); c.stroke();
    }
    c.fillStyle = '#c07f00'; c.font = '7.5px system-ui'; c.textAlign = 'left';
    c.fillText('UCL ' + fmt(ch.ucl, 1), 1, Y(ch.ucl) + 3);
    c.fillText('LCL ' + fmt(ch.lcl, 1), 1, Y(ch.lcl) + 3);
    c.fillStyle = '#0ea371';
    c.fillText('CL ' + fmt(ch.cl, 1), 1, Y(ch.cl) + 3);
  }

  /* 折线 */
  c.beginPath();
  for (var k = 0; k < pts.length; k++) {
    var px = X(k), py = Y(pts[k]);
    if (k === 0) c.moveTo(px, py); else c.lineTo(px, py);
  }
  c.strokeStyle = '#1e88ff'; c.lineWidth = 1.5; c.stroke();

  /* 点：越限标红 */
  for (var m = 0; m < pts.length; m++) {
    var out = ch.limits && (pts[m] > ch.ucl || pts[m] < ch.lcl);
    c.fillStyle = out ? '#ef4444' : '#1e88ff';
    c.beginPath(); c.arc(X(m), Y(pts[m]), out ? 3 : 2, 0, 6.2832); c.fill();
  }
}

function drawRchart(cv, ch) {
  var q = prepCv(cv); var c = q.c, W = q.W, H = q.H;
  var rs = ch.rs;
  var x0 = 24, x1 = W - 5, y0 = 8, y1 = H - 10;
  if (!rs.length) { drawEmptyChart(cv, ''); return; }
  var hi = 0;
  for (var i = 0; i < rs.length; i++) if (rs[i] > hi) hi = rs[i];
  if (ch.limits) hi = Math.max(hi, ch.uclR);
  if (hi < 1e-9) hi = 1;
  hi *= 1.15;
  var n = Math.max(rs.length, 12);
  var X = function (i2) { return x0 + (x1 - x0) * (i2 / Math.max(1, n - 1)); };
  var Y = function (v) { return y1 - (y1 - y0) * (v / hi); };

  if (ch.limits) {
    c.strokeStyle = 'rgba(245,158,11,.9)'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(x0, Y(ch.uclR)); c.lineTo(x1, Y(ch.uclR)); c.stroke();
    c.strokeStyle = 'rgba(18,185,129,.9)';
    c.beginPath(); c.moveTo(x0, Y(ch.clR)); c.lineTo(x1, Y(ch.clR)); c.stroke();
    c.fillStyle = '#c07f00'; c.font = '7.5px system-ui'; c.textAlign = 'left';
    c.fillText('UCLr', 1, Y(ch.uclR) + 3);
  }
  c.fillStyle = '#8aa0bb'; c.font = '7.5px system-ui'; c.textAlign = 'left';
  c.fillText('R 图', 1, 9);

  c.beginPath();
  for (var k = 0; k < rs.length; k++) {
    var px = X(k), py = Y(rs[k]);
    if (k === 0) c.moveTo(px, py); else c.lineTo(px, py);
  }
  c.strokeStyle = '#7b5cff'; c.lineWidth = 1.3; c.stroke();
  for (var m = 0; m < rs.length; m++) {
    var out = ch.limits && rs[m] > ch.uclR;
    c.fillStyle = out ? '#ef4444' : '#7b5cff';
    c.beginPath(); c.arc(X(m), Y(rs[m]), out ? 2.8 : 1.8, 0, 6.2832); c.fill();
  }
}

/* ============================================================
   PAF U 型曲线（结算页用）
   ============================================================ */
function drawPafCurve(cv, res) {
  var q = prepCv(cv, 460); var c = q.c, W = q.W, H = q.H;
  var curve = res.curve;
  if (!curve || !curve.length) return;
  var x0 = 34, x1 = W - 10, y0 = 12, y1 = H - 20;
  var lo = Infinity, hi = -Infinity;
  for (var i = 0; i < curve.length; i++) {
    if (curve[i].total < lo) lo = curve[i].total;
    if (curve[i].total > hi) hi = curve[i].total;
  }
  if (hi - lo < 1e-9) hi = lo + 1;
  var pad = (hi - lo) * 0.1; lo -= pad; hi += pad;
  var X = function (a) { return x0 + (x1 - x0) * (a - 0.02) / 0.70; };
  var Y = function (v) { return y1 - (y1 - y0) * (v - lo) / (hi - lo); };

  /* 健康区 20~35% */
  c.fillStyle = 'rgba(18,185,129,.10)';
  c.fillRect(X(0.20), y0, X(0.35) - X(0.20), y1 - y0);
  c.fillStyle = '#0ea371'; c.font = '9px system-ui'; c.textAlign = 'center';
  c.fillText('健康区 20~35%', (X(0.20) + X(0.35)) / 2, y0 + 10);

  /* 曲线 */
  c.beginPath();
  for (var k = 0; k < curve.length; k++) {
    var px = X(curve[k].a), py = Y(curve[k].total);
    if (k === 0) c.moveTo(px, py); else c.lineTo(px, py);
  }
  c.strokeStyle = '#1e88ff'; c.lineWidth = 2; c.stroke();

  /* 谷底 */
  var bi = 0;
  for (var m = 1; m < curve.length; m++) if (curve[m].total < curve[bi].total) bi = m;
  c.strokeStyle = 'rgba(18,185,129,.85)'; c.lineWidth = 1.3; c.setLineDash([3, 3]);
  c.beginPath(); c.moveTo(X(curve[bi].a), y0); c.lineTo(X(curve[bi].a), y1); c.stroke();
  c.setLineDash([]);

  /* 玩家落点 */
  var pa = clamp(res.appraisalRatio, 0.02, 0.72);
  var py2 = Y(res.TQC / Math.max(1, res.shipped));
  c.fillStyle = '#ef4444';
  c.beginPath(); c.arc(X(pa), py2, 5, 0, 6.2832); c.fill();
  c.fillStyle = '#fff';
  c.beginPath(); c.arc(X(pa), py2, 2.2, 0, 6.2832); c.fill();
  c.fillStyle = '#ef4444'; c.font = '700 10px system-ui'; c.textAlign = 'left';
  c.fillText('你 ' + pct(pa, 0), X(pa) + 8, py2 - 4);

  /* 轴 */
  c.strokeStyle = '#d5e2f2'; c.lineWidth = 1;
  c.beginPath(); c.moveTo(x0, y1); c.lineTo(x1, y1); c.stroke();
  c.beginPath(); c.moveTo(x0, y0); c.lineTo(x0, y1); c.stroke();
  c.fillStyle = '#8aa0bb'; c.font = '9px system-ui'; c.textAlign = 'center';
  c.fillText('鉴定成本占 TQC 比例 →', (x0 + x1) / 2, H - 5);
  c.save();
  c.translate(9, (y0 + y1) / 2); c.rotate(-Math.PI / 2);
  c.fillText('单件总质量成本', 0, 0);
  c.restore();
  c.textAlign = 'right';
  c.fillText('¥' + hi.toFixed(0), x0 - 3, y0 + 8);
  c.fillText('¥' + lo.toFixed(0), x0 - 3, y1);
}

/* ============================================================
   V2 控制器层 —— rAF 主循环 / 输入 / 弹层 / 开始页 / 结算页 / 存档装配
   依赖：v2_core1~4（引擎） + v2_ui_render.js + v2_ui_spc.js
   ============================================================ */
'use strict';

var APP = {
  last: 0,
  raf: 0,
  modalOpen: false,
  sound: true,
  started: false,
  autoSaveAcc: 0,
  fpsAcc: 0,
  fpsN: 0
};

/* ============================================================
   统一渲染
   —— 拆成「高频（每帧）」与「低频（4Hz）」两档。
   产线画布和顶栏必须每帧刷新才有流水线的动感；
   而 SPC / CPK / PAF / 缺陷表是重排 DOM 的操作，
   4Hz 足够读数，全帧重排会在 4× 速度下明显掉帧。
   ============================================================ */
var _slowAcc = 0;
function renderAll(dt) {
  if (!G) return;
  renderTop();
  drawLine();
  _slowAcc += (dt === undefined ? 0.25 : dt);
  if (_slowAcc >= 0.25) {
    _slowAcc = 0;
    renderProcBar();
    renderParams();
    renderSPC();
    renderCPK();
    renderOrder();
    renderPAF();
    renderDefects();
    renderOps();
    renderLog();
  }
}

/* 强制全量刷新（切工位、买科技、改 BOM 后调用） */
function renderNow() {
  _slowAcc = 99;
  renderAll(0);
}

/* ============================================================
   主循环
   ============================================================ */
function loop(ts) {
  APP.raf = requestAnimationFrame(loop);
  if (!APP.last) APP.last = ts;
  var dt = (ts - APP.last) / 1000;
  APP.last = ts;
  if (dt > 0.4) dt = 0.4;               // 后台标签页回来时不要一次跳几十秒
  if (!G) return;

  UI.flow += dt;                        // 输送带流动相位

  if (G.running && !G.over && !G.pendingEvent && !APP.modalOpen) {
    tick(dt);
    /* 事件弹窗：引擎把 pendingEvent 置上后由控制器弹层 */
    if (G.pendingEvent) { openEventModal(); }
    /* 关卡结束 */
    if (G.over && G.result) { onFinish(); }
    /* 自动快照：每 12 秒存一次，崩溃/误关不丢进度 */
    APP.autoSaveAcc += dt;
    if (APP.autoSaveAcc >= 12) { APP.autoSaveAcc = 0; saveSnapshot(); }
  }
  renderAll(dt);
}

function startLoop() {
  if (APP.raf) cancelAnimationFrame(APP.raf);
  APP.last = 0;
  APP.raf = requestAnimationFrame(loop);
}

   ============================================================ */
/* GameAudio 暴露的是语义化事件（score/error/levelUp/gameOver/whack/escape），
   这里做一层名字映射，避免 UI 层散落对音频内部 API 的直接依赖。 */
function sfx(name) {
  if (!APP.sound) return;
  if (typeof GameAudio === 'undefined') return;
  try {
    switch (name) {
      case 'click': if (GameAudio.whack) GameAudio.whack(0); break;
      case 'buy': if (GameAudio.score) GameAudio.score(3); break;
      case 'good': if (GameAudio.score) GameAudio.score(1); break;
      case 'alert': if (GameAudio.error) GameAudio.error(); break;
      case 'escape': if (GameAudio.escape) GameAudio.escape(); break;
      case 'win': if (GameAudio.gameOver) GameAudio.gameOver(true); break;
      case 'lose': if (GameAudio.gameOver) GameAudio.gameOver(false); break;
      case 'start': if (GameAudio.start) GameAudio.start(); break;
    }
  } catch (e) { }
}
function bootAudio() {
  if (typeof GameAudio === 'undefined') return;
  try {
    if (!APP.audioBooted) { GameAudio.boot('sixsigma'); APP.audioBooted = true; }
    if (GameAudio.setLevel && G) GameAudio.setLevel(G.lv.id);
    if (GameAudio.setMuted) GameAudio.setMuted(!APP.sound);
  } catch (e) { }
}

    'α = 过杀（好件被判坏，白扔一件料）；β = 漏检（坏件放行，出货即索赔）。<br>' +
    '量具本身有 GRR，测量值 = 真值 + 测量误差，所以阈值卡得越死，α 涨得比 β 降得快 —— 总成本对阈值是一条 U 型曲线，门面板里直接画给你看，谷底就是经济最优阈值。<br><br>' +

    '<b style="color:var(--acc)">■ 田口稳健性：CPK 的物理杠杆</b><br>' +
    '设备温漂传到 CTQ 的量 = |dY/dX| × 漂移幅度。把工作点选在响应曲线的驻点（空洞率 U 型谷底、拉力倒 U 峰顶），斜率趋近 0，同样的漂移就传不过去。<br>' +
    '<span style="color:var(--ok)">这就是「均值达标 ≠ CPK 达标」的根源，也是本作最深的策略。</span>参数面板会实时显示「噪声传递占比」。<br><br>' +

    '<b style="color:var(--acc)">■ 二次焊热耦合（M3）</b><br>' +
    '二次焊峰值温度 T2 逼近一次焊料熔点 Tm1 时，一次焊层会重熔 → 芯片漂移，这是 sev=3 的致命缺陷。<br>' +
    '焊片选经济档 SAC305（Tm1=217℃）就把热窗口压死了；选 Sn-Sb 高温档（250℃）能给 T2 留出余量。<span style="color:var(--warn)">采购降本的代价会在这里现形。</span><br><br>' +

    '<b style="color:var(--acc)">■ PAF 质量成本</b><br>' +
    'P 预防 / A 鉴定 / IF 内部失效 / EF 外部失效。健康的鉴定占比在 20~35%：低了漏检爆 EF，高了检测成本自己吃掉利润。结算页会画出你落在 U 型曲线的哪个位置。<br><br>' +

/* ============================================================
   结算页
   ============================================================ */
function onFinish() {
  var r = G.result;
  clearSnapshot();
  sfx(r.pass ? 'win' : 'lose');
  openResult(r);
}

function dimCard(label, v, w) {
  var col = v >= 0.85 ? 'var(--ok)' : v >= 0.6 ? 'var(--acc)' : v >= 0.4 ? 'var(--warn)' : 'var(--bad)';
  return '<div class="dimCard"><div class="dv" style="color:' + col + '">' + v.toFixed(2) +
    '</div><div class="dn">' + label + '</div><div class="dw">权重 ' + w + '</div></div>';
}

function openResult(r) {
  var body = el('div');

  /* --- 大分 --- */
  var big = el('div');
  big.innerHTML =
    '<div id="scoreBig" style="color:' + (r.pass ? 'var(--ok)' : 'var(--bad)') + '">' +
    r.score.toFixed(1) + '<span style="font-size:16px;color:var(--mut)"> / 100</span></div>' +
    '<div style="text-align:center;font-size:14px;font-weight:600;color:' +
    (r.pass ? 'var(--ok)' : 'var(--bad)') + '">' + (r.pass ? '✔ 关卡通过' : '✖ 关卡未通过') + '</div>';
  body.appendChild(big);

  if (r.reasons && r.reasons.length) {
    var rs = el('div', 'tagline');
    rs.style.justifyContent = 'center';
    rs.style.marginTop = '6px';
    var h = '';
    for (var i = 0; i < r.reasons.length; i++) h += '<span class="tag bad">' + esc(r.reasons[i]) + '</span>';
    rs.innerHTML = h;
    body.appendChild(rs);
  }

  /* --- 四维 --- */
  var dg = el('div', 'dimGrid');
  dg.innerHTML =
    dimCard('质量 Q', r.dims.q, '35%') +
    dimCard('成本 C', r.dims.c, '25%') +
    dimCard('效率 E', r.dims.e, '20%') +
    dimCard('收益 R', r.dims.r, '20%');
  body.appendChild(dg);

  /* --- 关键指标 --- */
  var kv = el('div');
  kv.style.marginTop = '10px';
  var uc = r.unitCost, tc = r.targetCost;
  function line(k, v, col) {
    return '<div class="kv"><span>' + k + '</span><b' + (col ? ' style="color:' + col + '"' : '') + '>' + v + '</b></div>';
  }
  kv.innerHTML =
    line('交付', r.shipped + ' / ' + r.qty + '（' + pct(r.deliverRate) + '）',
      r.deliverRate >= 0.98 ? 'var(--ok)' : 'var(--bad)') +
    line('用时', mmss(r.t) + ' / ' + mmss(r.timeLimit) + '（' + pct(r.t / r.timeLimit, 0) + '）',
      r.t / r.timeLimit <= 0.75 ? 'var(--ok)' : r.t / r.timeLimit <= 1 ? 'var(--warn)' : 'var(--bad)') +
    line('投料 / 报废 / 返工', r.released + ' / ' + r.scrapped + ' / ' + r.reworked) +
    line('一次通过率 FPY', pct(r.fpy), r.fpy >= 0.8 ? 'var(--ok)' : 'var(--warn)') +
    line('逃逸', r.escaped + ' 件（' + pct(r.escRate, 2) + '，红线 ' + pct(r.escLimit, 1) + '）',
      r.escBreach ? 'var(--bad)' : 'var(--ok)') +
    line('过杀 α / 漏检 β', r.overkill + ' / ' + r.missed) +
    line('降级出货', r.downgraded + ' 件') +
    '<div style="height:8px"></div>' +
    line('营业收入', money(r.revenue)) +
    line('物料（已费用化）', money(r.matCost)) +
    line('在制存货', r.wipUnits + ' 件 / ' + money(r.wipValue), 'var(--mut)') +
    line('人工', money(r.laborCost)) +
    line('质量总成本 TQC', money(r.TQC)) +
    line('单件成本', money(uc) + '（目标 ' + money(tc) + '）', uc <= tc ? 'var(--ok)' : 'var(--bad)') +
    line('利润 / 毛利率', money(r.profit) + ' / ' + pct(r.gm) + '（目标 ' + pct(r.targetGM) + '）',
      r.gm >= r.targetGM ? 'var(--ok)' : 'var(--bad)');
  body.appendChild(kv);

  /* --- PAF 四象限 --- */
  var pg = el('div', 'pafGrid');
  pg.style.marginTop = '10px';
  function pc(n, v, t) {
    return '<div class="pafCard"><div class="pv2">' + money(v) + '</div><div class="pn2">' + n +
      '<br><span style="color:var(--mut)">' + t + '</span></div></div>';
  }
  pg.innerHTML =
    pc('预防 P', r.paf.P, '培训/保养/干燥') +
    pc('鉴定 A', r.paf.A, '检测/量具') +
    pc('内部失效 IF', r.paf.IF, '报废/返工/停机') +
    pc('外部失效 EF', r.paf.EF, '客户索赔');
  body.appendChild(pg);

  var hint = el('div', 'tagline');
  hint.style.marginTop = '6px';
  hint.innerHTML =
    '<span class="tag ' + (r.healthy ? 'ok' : 'warn') + '">鉴定占比 ' + pct(r.appraisalRatio) +
    (r.healthy ? '（健康区 20~35%）' : '（偏离健康区 20~35%）') + '</span>';
  body.appendChild(hint);

  /* --- PAF U 型曲线 --- */
  var cvBox = el('div', 'curveBox');
  cvBox.style.marginTop = '8px';
  cvBox.innerHTML = '<div class="cvitem"><b>质量成本 U 型曲线 · 你的落点</b></div>';
  var cv = document.createElement('canvas');
  cv.style.width = '100%';
  cv.style.height = '150px';
  cvBox.appendChild(cv);
  body.appendChild(cvBox);
  requestAnimationFrame(function () { drawPafCurve(cv, r); });

  /* --- CPK 明细 --- */
  if (r.cpk && r.cpk.length) {
    var cg = el('div', 'cpkGrid');
    cg.style.marginTop = '10px';
    var ch = '';
    for (var c = 0; c < r.cpk.length; c++) {
      var it = r.cpk[c];
      ch += '<div class="cpkCard ' + (it.pass ? 'ok' : 'bad') + '"><div class="t">' + esc(it.name) +
        '</div><div class="v">' + (it.cpk === null ? '—' : it.cpk.toFixed(2)) +
        '</div><div class="n">需 ≥ ' + it.need.toFixed(2) + '</div></div>';
    }
    cg.innerHTML = ch;
    body.appendChild(cg);
  }

  /* --- 底部按钮 --- */
  var foot = [];
  foot.push({ t: '🔁 重打本关', cls: '', fn: function () { closeModal(); startLevel(G.lvIdx); } });
  var prog = loadProgress();
  if (r.pass && G.lvIdx + 1 < LEVELS.length) {
    foot.push({
      t: '▶ 下一关：' + LEVELS[G.lvIdx + 1].name, cls: 'pri',
      fn: function () { closeModal(); startLevel(G.lvIdx + 1); }
    });
  }
  foot.push({ t: '返回关卡选择', cls: r.pass && G.lvIdx + 1 < LEVELS.length ? '' : 'pri', fn: function () { closeModal(); toStart(); } });

  openModal({
    title: (r.pass ? '🏆 ' : '📉 ') + G.lv.name + ' 结算',
    sub: PRICE[G.lv.grade].name + ' · 目标 ' + r.qty + ' 件',
    size: 'md', body: body, noClose: true, foot: foot
  });
}

/* ============================================================
   开始页
   ============================================================ */
function renderStart() {
  var grid = $('lvGrid');
  if (!grid) return;
  grid.innerHTML = '';
  var prog = loadProgress();
  var scores = loadScores();

  for (var i = 0; i < LEVELS.length; i++) {
    (function (lv, idx) {
      var locked = idx > prog.unlocked;
      var sc = scores[lv.id];
      var card = el('div', 'lvCard' + (locked ? ' lock' : ''));
      var pr = PRICE[lv.grade];
      card.innerHTML =
        '<div class="no">' + (locked ? '🔒' : (sc && sc.pass ? '✔' : '')) + ' L' + lv.id + '</div>' +
        '<h3>' + esc(lv.name) + '</h3>' +
        '<div class="br">' + esc(lv.brief) + '</div>' +
        '<div class="mt">' + pr.name + ' · ' + lv.qty + ' 件 · ' + mmss(lv.timeLimit) +
        ' · CPK≥' + lv.cpk.toFixed(2) + ' · 逃逸≤' + pct(lv.escLimit, 1) + '</div>' +
        '<div class="mt">目标成本 ' + money(lv.targetCost) + ' · 目标毛利 ' + pct(lv.targetGM, 0) + '</div>' +
        (sc ? '<div class="sc">历史最佳 ' + sc.score.toFixed(1) + (sc.pass ? ' ✔' : '') + '</div>' : '');
      if (!locked) {
        card.onclick = function () { startLevel(idx); };
      }
      grid.appendChild(card);
    })(LEVELS[i], i);
  }

  var btnR = $('btnResume');
  if (btnR) {
    var has = hasSnapshot();
    btnR.disabled = !has;
    btnR.textContent = has ? '▶ 继续存档' : '（无存档）';
  }
  var btnS = $('btnSound');
  if (btnS) btnS.textContent = APP.sound ? '🔊 音效 开' : '🔇 音效 关';
}

function toStart() {
  var app = $('app'), st = $('start');
  if (app) app.classList.add('hide');
  if (st) st.style.display = 'flex';
  APP.started = false;
  renderStart();
}

function toGame() {
  var app = $('app'), st = $('start');
  if (st) st.style.display = 'none';
  if (app) app.classList.remove('hide');
  APP.started = true;
}

/* ============================================================
   开局 / 载入
   ============================================================ */
function startLevel(idx) {
  var prog = loadProgress();
  newGame(idx, { money: prog.money, rep: prog.rep, techs: prog.techs });
  G.running = true;
  G.speed = 1;
  UI.sel = 1;
  UI.curveKey = null;
  APP.autoSaveAcc = 0;
  clearSnapshot();
  toGame();
  syncSpeedBtns();
  resizeCanvases();
  renderNow();
  bootAudio();
  sfx('start');
  logMsg('sys', '▶ ' + G.lv.name + ' 开工 · 目标 ' + G.lv.qty + ' 件 / ' + mmss(G.lv.timeLimit));
  logMsg('info', '💡 ' + G.lv.hint);
}

function resumeGame() {
  if (!loadSnapshot()) { renderStart(); return; }
  G.running = true;
  G.speed = 1;
  UI.sel = 1;
  toGame();
  syncSpeedBtns();
  resizeCanvases();
  renderNow();
  bootAudio();
}

/* ============================================================
   输入
   ============================================================ */
function setSpeed(s) {
  if (!G) return;
  if (s === 0) { G.running = !G.running; }
  else { G.speed = s; G.running = true; }
  syncSpeedBtns();
  sfx('click');
}

function syncSpeedBtns() {
  var box = $('spdBox');
  if (!box || !G) return;
  var bs = box.getElementsByTagName('button');
  for (var i = 0; i < bs.length; i++) {
    var s = +bs[i].getAttribute('data-s');
    var on = (s === 0) ? !G.running : (G.running && G.speed === s);
    if (on) bs[i].classList.add('on'); else bs[i].classList.remove('on');
    if (s === 0) bs[i].textContent = G.running ? '❚❚' : '▶';
  }
}

function resizeCanvases() {
  var cv = $('lineCv');
  if (!cv) return;
  var w = cv.parentNode ? cv.parentNode.clientWidth : 0;
  if (w > 0) { cv.width = w * (window.devicePixelRatio || 1); }
}

/* ===================== 移动端适配辅助 ===================== */
function isMobile() {
  return typeof window !== 'undefined' && window.matchMedia &&
         window.matchMedia('(max-width:900px)').matches;
}

/* 底部标签栏切换（单栏布局下显示对应面板） */
function switchMobileTab(tab) {
  var main = $('main'); if (!main) return;
  main.setAttribute('data-tab', tab);
  var tabs = $('mTabs');
  if (tabs) {
    var bs = tabs.querySelectorAll('button');
    for (var i = 0; i < bs.length; i++)
      bs[i].classList.toggle('on', bs[i].getAttribute('data-tab') === tab);
  }
  renderNow();
}

function showLineTip(mx, my, i) {
  var cv = $('lineCv'), tip = $('lineTip');
  if (!cv || !tip || i < 0 || !G) { if (tip) tip.style.display = 'none'; return; }
  var p = G.procs[i], r = cv.getBoundingClientRect();
  tip.style.display = 'block';
  tip.style.left = Math.min(r.width - 210, mx + 12) + 'px';
  tip.style.top = (my + 12) + 'px';
  tip.innerHTML = '<b>' + esc(p.d.name) + '</b><br>' +
    (p.d.gate ? '检测门 · 覆盖 ' + (p.cov === 'none' ? '免检' : p.cov) : '加工站 · 抽检 ' + p.sampling) +
    '<br>队列 ' + p.queue.length + '/' + p.buf + ' · 已加工 ' + p.cnt +
    '<br>健康度 ' + pct(p.machine.health, 0) + (p.machine.down > 0 ? ' · <span style="color:var(--bad)">停机中</span>' : '');
}
function hideLineTip() {
  var tip = $('lineTip'); if (tip) tip.style.display = 'none';
}

/* 画布触控：点选 + 长按看 tip（替代鼠标 hover/click，避免 300ms 与双击缩放） */
function bindLineTouch(cv) {
  if (!cv || !('ontouchstart' in window)) return;
  var sx = 0, sy = 0, moved = false, lp = null;
  cv.addEventListener('touchstart', function (e) {
    if (!e.touches || !e.touches.length) return;
    e.preventDefault();   /* 阻止合成鼠标事件与页面滚动，避免双触发/缩放 */
    var r = cv.getBoundingClientRect(), t = e.touches[0];
    sx = t.clientX - r.left; sy = t.clientY - r.top; moved = false;
    lp = setTimeout(function () { var i = lineHit(sx, sy); if (i >= 0) showLineTip(sx, sy, i); }, 400);
  }, { passive: false });
  cv.addEventListener('touchmove', function (e) {
    if (!e.touches || !e.touches.length) return;
    var r = cv.getBoundingClientRect(), t = e.touches[0];
    if (Math.abs((t.clientX - r.left) - sx) > 8 || Math.abs((t.clientY - r.top) - sy) > 8) {
      moved = true; if (lp) { clearTimeout(lp); lp = null; }
    }
  }, { passive: true });
  cv.addEventListener('touchend', function () {
    if (lp) { clearTimeout(lp); lp = null; }
    if (moved) { hideLineTip(); return; }
    var i = lineHit(sx, sy);
    if (i >= 0) {
      selectProc(i); sfx('click');
      showLineTip(sx, sy, i);
      setTimeout(hideLineTip, 1700);
      if (isMobile() && APP.started && G && !G.over) switchMobileTab('param');
    } else hideLineTip();
  }, { passive: true });
}

/* ☰ 抽屉：把顶栏收起的 5 个按钮做成下拉面板 */
function bindMenuDrawer() {
  var bm = $('btnMenu'); if (!bm) return;
  bm.addEventListener('click', function () {
    var d = document.getElementById('mDrawer');
    if (d) { d.classList.toggle('show'); return; }
    d = document.createElement('div'); d.id = 'mDrawer'; d.className = 'mDrawer';
    var ids = ['btnTech', 'btnBom', 'btnTrace', 'btnHelp', 'btnQuit'];
    var labels = ['🔬 科技树', '📦 BOM 采购', '🔍 缺陷追溯', '❓ 玩法说明', '⏏ 退出本关'];
    var panel = document.createElement('div'); panel.className = 'mDrawerPanel';
    var h = document.createElement('div'); h.className = 'mh2';
    h.innerHTML = '<span>菜单</span><button aria-label="关闭">✕</button>';
    var wrap = document.createElement('div'); wrap.className = 'mb2';
    for (var i = 0; i < ids.length; i++) {
      (function (id, txt) {
        var src = document.getElementById(id);
        var b = document.createElement('button'); b.className = 'btn'; b.textContent = txt;
        b.onclick = function () {
          d.classList.remove('show');
          if (src && src.onclick) src.onclick(); else if (src) src.click();
        };
        wrap.appendChild(b);
      })(ids[i], labels[i]);
    }
    h.querySelector('button').onclick = function () { d.classList.remove('show'); };
    panel.appendChild(h); panel.appendChild(wrap);
    d.appendChild(panel);
    d.addEventListener('click', function (e) { if (e.target === d) d.classList.remove('show'); });
    document.body.appendChild(d);
    d.classList.add('show');
  });
}

function bindInputs() {
  /* 速度 */
  var box = $('spdBox');
  if (box) {
    box.onclick = function (e) {
      var t = e.target;
      if (t && t.tagName === 'BUTTON') setSpeed(+t.getAttribute('data-s'));
    };
  }

  /* 顶栏按钮 */
  var map = {
    btnTech: openTech, btnBom: openBom, btnTrace: openTrace, btnHelp: openHelp,
    btnQuit: function () {
      if (!G) { toStart(); return; }
      openModal({
        title: '退出本关', size: 'sm',
        body: el('div', '', '<div style="font-size:13px;line-height:1.7">当前进度会保存为存档，可从开始页继续。</div>'),
        foot: [
          { t: '取消', cls: '', fn: closeModal },
          {
            t: '保存并退出', cls: 'warn', fn: function () {
              if (G && !G.over) saveSnapshot();
              closeModal(); toStart();
            }
          }
        ]
      });
    }
  };
  for (var k in map) {
    (function (id, fn) {
      var b = $(id);
      if (b) b.onclick = function () { fn(); };
    })(k, map[k]);
  }

  /* 开始页按钮 */
  var bR = $('btnResume'); if (bR) bR.onclick = function () { resumeGame(); };
  var bD = $('btnDoc'); if (bD) bD.onclick = function () { openHelp(); };
  var bS = $('btnSound');
  if (bS) {
    bS.onclick = function () {
      APP.sound = !APP.sound;
      try { if (typeof GameAudio !== 'undefined' && GameAudio.setMuted) GameAudio.setMuted(!APP.sound); } catch (e) { }
      bS.textContent = APP.sound ? '🔊 音效 开' : '🔇 音效 关';
    };
  }
  var bX = $('btnReset');
  if (bX) {
    bX.onclick = function () {
      openModal({
        title: '重置进度', size: 'sm',
        body: el('div', '', '<div style="font-size:13px;line-height:1.7;color:var(--bad)">将清空全部关卡解锁、历史成绩与存档，且不可恢复。</div>'),
        foot: [
          { t: '取消', cls: 'pri', fn: closeModal },
          { t: '确认重置', cls: 'warn', fn: function () { resetProgress(); closeModal(); renderStart(); } }
        ]
      });
    };
  }

  /* 产线画布：hover（桌面）+ 点选（通用）+ 触控（移动） */
  var cv = $('lineCv');
  if (cv) {
    cv.onmousemove = function (e) {
      var r = cv.getBoundingClientRect();
      UI.hover = lineHit(e.clientX - r.left, e.clientY - r.top);
      cv.style.cursor = UI.hover >= 0 ? 'pointer' : 'default';
      showLineTip(e.clientX - r.left, e.clientY - r.top, UI.hover);
    };
    cv.onmouseleave = function () {
      UI.hover = -1; hideLineTip();
    };
    cv.onclick = function (e) {
      var r = cv.getBoundingClientRect();
      var i = lineHit(e.clientX - r.left, e.clientY - r.top);
      if (i >= 0) {
        selectProc(i); sfx('click');
        if (isMobile() && APP.started && G && !G.over) switchMobileTab('param');
      }
    };
    bindLineTouch(cv);   /* 触控设备额外绑定（非触控设备自动跳过） */
  }

  /* 底部标签栏切换（移动端） */
  var mTabs = $('mTabs');
  if (mTabs) {
    var mtBtns = mTabs.querySelectorAll('button');
    for (var mi = 0; mi < mtBtns.length; mi++) {
      mtBtns[mi].onclick = function () { switchMobileTab(this.getAttribute('data-tab')); };
    }
  }
  bindMenuDrawer();   /* ☰ 抽屉 */

  /* 键盘 */
  document.addEventListener('keydown', function (e) {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    var key = e.key;
    if (key === 'Escape') {
      if (APP.modalOpen && !(G && G.pendingEvent)) { closeModal(); e.preventDefault(); }
      return;
    }
    if (!APP.started || !G || G.over) return;
    if (APP.modalOpen) return;
    switch (key) {
      case ' ': setSpeed(0); e.preventDefault(); break;
      case '1': setSpeed(1); break;
      case '2': setSpeed(2); break;
      case '4': setSpeed(4); break;
      case 'ArrowLeft': selectProc((UI.sel - 1 + G.procs.length) % G.procs.length); e.preventDefault(); break;
      case 'ArrowRight': selectProc((UI.sel + 1) % G.procs.length); e.preventDefault(); break;
      case 't': case 'T': openTech(); break;
      case 'b': case 'B': openBom(); break;
      case 'p': case 'P': doPM(UI.sel); renderNow(); break;
      case 'r': case 'R':
        if (G.procs[UI.sel] && G.procs[UI.sel].chart) {
          G.procs[UI.sel].chart.resetBaseline();
          logMsg('info', '↻ ' + G.procs[UI.sel].d.short + ' SPC 基线重建');
          renderNow();
        }
        break;
    }
  });

  /* 窗口尺寸 */
  window.addEventListener('resize', function () { resizeCanvases(); renderNow(); });

  /* 离开页面保存 */
  window.addEventListener('beforeunload', function () {
    if (G && G.running && !G.over) saveSnapshot();
  });
}

/* ============================================================
   启动
   ============================================================ */
function bootApp() {
  bindInputs();
  /* 禁用 iOS Safari 双指缩放 / 双击缩放（viewport 已禁用用户缩放，这里兜底） */
  try {
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    document.addEventListener('dblclick', function (e) {
      if (isMobile()) e.preventDefault();
    }, { passive: false });
  } catch (e) { }
  toStart();
  startLoop();
}

if (typeof document !== 'undefined') {
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bootApp);
  } else {
    bootApp();
  }
}


/* ------------------------------------------------------------ */

/* ============================================================
   V3 备料 UI 与流程 —— 在 V2 之上做加法（不修改任何 v2 分片）
   第一步：选材料备料
     · 关卡卡片点击 → openPrep（先备料，再进生产）
     · 包装 newGame / startLevel / finish / renderStart 接入 V2
     · 多选：扣额外成本 + 评分/声誉惩罚（不阻断）
     · 完全匹配：评分/声誉奖励
     · 少选：前端硬拦截，禁止开工
   ============================================================ */
'use strict';

/* ---------- 全局状态 ---------- */
var PREP_STATE = null;      // { idx, data, sel:{}, train, last }
var PENDING_PREP = null;    // 传递给 newGame 的备料结果

/* ---------- 注入备料界面 DOM ---------- */
function ensurePrepDOM() {
  if (document.getElementById('prep')) return;
  var d = document.createElement('div');
  d.id = 'prep';
  d.className = 'hide';
  d.innerHTML =
    '<div class="pInner">' +
      '<div class="pHead">' +
        '<div><b id="pTitle">📦 备料</b>' +
        '<i id="pSub">第一步：从候选物料中选出本批订单真正需要的料</i></div>' +
        '<label class="pTrain"><input type="checkbox" id="pTrain"> 训练模式（标出疑似干扰）</label>' +
      '</div>' +
      '<div class="pBar" id="pBar"></div>' +
      '<div class="pBanner" id="pBanner"></div>' +
      '<div class="pGrid" id="pGrid"></div>' +
      '<div class="pFoot">' +
        '<button class="btn" id="pBack">← 返回</button>' +
        '<button class="btn pri" id="pConfirm">✅ 备料确认</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(d);
  document.getElementById('pBack').onclick = function () {
    d.classList.add('hide'); d.style.display = 'none'; toStart();
  };
  document.getElementById('pTrain').onchange = function () {
    APP.prepTrain = this.checked;
    if (PREP_STATE) {
      PREP_STATE.train = APP.prepTrain;
      PREP_STATE.data = buildPrep(PREP_STATE.idx, { trainMode: APP.prepTrain });
      PREP_STATE.sel = {};
      renderPrep();
    }
  };
  document.getElementById('pConfirm').onclick = confirmPrep;
}

/* ---------- 打开备料 ---------- */
function openPrep(idx) {
  ensurePrepDOM();
  var data = buildPrep(idx, { trainMode: !!APP.prepTrain });
  PREP_STATE = { idx: idx, data: data, sel: {}, train: !!APP.prepTrain, last: null };
  var st = document.getElementById('start'); if (st) st.style.display = 'none';
  var pp = document.getElementById('prep');
  pp.classList.remove('hide'); pp.style.display = 'flex';
  renderPrep();
  if (window.sfx) sfx('click');
}

/* ---------- 渲染 ---------- */
function renderPrep() {
  if (!PREP_STATE) return;
  var s = PREP_STATE, d = s.data;
  var lv = LEVELS[s.idx];
  document.getElementById('pTitle').textContent = '📦 备料 · L' + lv.id + ' ' + lv.name;

  var selKeys = Object.keys(s.sel).filter(function (k) { return s.sel[k]; });
  var v = validatePrep(selKeys, d.required, d.distractorIds);
  s.last = v;

  /* 摘要条 */
  var cls = 'ok';
  if (v.blocked) cls = 'bad';
  else if (v.extra.length) cls = 'warn';
  var over = v.selectedCost > d.budget;
  document.getElementById('pBar').innerHTML =
    '<span>已选 <b class="' + cls + '">' + selKeys.length + '</b> / 需求 ' + d.required.length + '</span>' +
    '<span>备料成本 <b>¥' + v.selectedCost + '</b> / 预算 ¥' + d.budget + (over ? ' <i class="bad">超支</i>' : '') + '</span>' +
    (v.extraCost > 0 ? '<span class="bad">额外成本 ¥' + v.extraCost + '</span>' : '') +
    (v.exact ? '<span class="ok">✓ 完全匹配</span>' : '');

  /* 横幅（仅多选/完全匹配提示，少选静默拦截） */
  var bn = document.getElementById('pBanner');
  bn.className = 'pBanner';
  bn.style.display = 'none';
  if (!v.blocked && v.extra.length) {
    bn.className = 'pBanner warn';
    bn.style.display = 'block';
    bn.innerHTML = '⚠️ <b>多选 ' + v.extra.length + ' 项</b>（含干扰 ' + v.distractorSel.length +
      ' 项）→ 额外成本 ¥' + v.extraCost +
      '，不阻断流程，但将记入额外成本并影响最终评分与声誉。';
  } else if (!v.blocked && v.exact) {
    bn.className = 'pBanner ok';
    bn.style.display = 'block';
    bn.innerHTML = '✅ 备料与真实需求完全匹配，可开工。';
  }

  /* 物料卡片 */
  var grid = document.getElementById('pGrid');
  grid.innerHTML = '';
  d.items.forEach(function (m) {
    var on = !!s.sel[m.id];
    var card = document.createElement('div');
    card.className = 'matCard' + (on ? ' sel' : '') + (m.isDistractor ? ' dist' : '');
    card.innerHTML =
      '<div class="mTop"><span class="mIcon">' + m.icon + '</span>' +
      '<span class="mCheck">' + (on ? '☑' : '☐') + '</span></div>' +
      '<div class="mName">' + esc(m.name) + '</div>' +
      '<div class="mCat">' + esc(m.cat) + '</div>' +
      '<div class="mCost">¥' + m.cost + '</div>';
    card.onclick = function () {
      s.sel[m.id] = !s.sel[m.id];
      renderPrep();
      if (window.sfx) sfx('click');
    };
    grid.appendChild(card);
  });
}

/* ---------- 确认备料 ---------- */
function confirmPrep() {
  if (!PREP_STATE) return;
  var s = PREP_STATE;
  var v = s.last || validatePrep(Object.keys(s.sel).filter(function (k) { return s.sel[k]; }),
                                 s.data.required, s.data.distractorIds);
  if (v.blocked) {                 // 少选：硬拦截，不进入生产
    if (window.sfx) sfx('bad');
    renderPrep();
    return;
  }
  var pp = document.getElementById('prep');
  pp.classList.add('hide'); pp.style.display = 'none';
  if (window.sfx) sfx('start');
  startLevel(s.idx, v);            // 多选不阻断，照常进入生产
}

/* ---------- 包装 V2 函数，接入备料 ---------- */
var _newGame = newGame;
newGame = function (levelIdx, carry) {
  var g = _newGame(levelIdx, carry);
  if (PENDING_PREP) { g.prep = PENDING_PREP; PENDING_PREP = null; }
  return g;
};

var _startLevel = startLevel;
startLevel = function (idx, prep) {
  if (prep) PENDING_PREP = prep;
  _startLevel(idx);
  if (G && G.prep) {
    if (G.prep.exact) {
      logMsg('good', '📦 备料完美匹配，进入生产');
    } else {
      G.money -= G.prep.extraCost;   // 多选额外成本即时扣款
      logMsg('bad', '📦 备料多选 ' + G.prep.extra.length + ' 项（干扰 ' +
        G.prep.distractorSel.length + '）→ 额外成本 ' + money(G.prep.extraCost));
    }
  }
};

var _finish = finish;
finish = function (complete) {
  var r = _finish(complete);
  if (G && G.prep) applyPrepEffect(r);
  return r;
};

/* 备料结果对最终评分/声誉的影响 */
function applyPrepEffect(r) {
  var p = G.prep; if (!p) return;
  var reasons = r.reasons || (r.reasons = []);
  if (p.exact) {
    r.score = Math.min(100, r.score + 1.5);
    G.rep = clamp(G.rep + 2, 0, 100);
    reasons.push('备料完美匹配：声誉 +2，评分 +1.5');
  } else {
    var pen = Math.min(8, p.extraCost / 60);          // 额外成本折算扣分
    r.score = Math.max(0, r.score - pen);
    var repPen = p.extra.length * 2;                  // 每多选 1 项声誉 -2
    G.rep = clamp(G.rep - repPen, 0, 100);
    reasons.push('备料多选 ' + p.extra.length + ' 项（含干扰 ' + p.distractorSel.length +
      ' 项）→ 额外成本 ' + money(p.extraCost) + '，评分 −' + pen.toFixed(1) + '，声誉 −' + repPen);
  }
  r.rep = G.rep;
}

/* ---------- 关卡卡片点击改为「先备料」 ---------- */
var _renderStart = renderStart;
renderStart = function () {
  _renderStart();
  var grid = document.getElementById('lvGrid'); if (!grid) return;
  var cards = grid.querySelectorAll('.lvCard');
  for (var i = 0; i < cards.length; i++) {
    (function (card, idx) {
      if (!card.classList.contains('lock')) {
        card.onclick = function () { openPrep(idx); };
      }
    })(cards[i], i);
  }
};

/* ---------- 初始化（在 V2 的 bootApp 之后执行） ---------- */
function initV3() {
  var logo = document.querySelector('#topbar .logo b');
  if (logo) logo.textContent = 'IGBT 产线经营 V3';
  var hero = document.querySelector('#start .hero h1');
  if (hero) hero.textContent = 'IGBT 功率模组产线经营 · V3';
  var heroSub = document.querySelector('#start .hero p');
  if (heroSub) heroSub.textContent =
    '18 道工序 · 10 项 BOM · 5 道检测门 · 新增「第一步·选材料备料」——在成本、质量、效率、收益与辨识力之间取舍';
  ensurePrepDOM();
  APP.prepTrain = false;
  renderStart();   // 重新绑定关卡卡片 → openPrep
}
initV3();

</script>
