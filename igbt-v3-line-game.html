var DRIFT_KEY = {
  DIEATT: 'placeForce', REFLOW1: 'peakTemp', BOND: 'usPower', PASTE: 'printPress',
  NTC: 'ntcForce', PININS: 'insertForce', REFLOW2: 'peakTemp2', CLEAN: 'washTemp',
  CASE: 'glueVol', POT: 'gelTemp', CURE: 'cureTemp', COVER: 'clipForce',
  TEST: 'burnTemp', PACK: 'desiccant'
};
/* 漂移速率（主参数单位 / 分钟，健康度 1.0 时）—— 方向按工程常识取「劣化侧」 */
var DRIFT_RATE = {
  DIEATT: -0.06, REFLOW1: 0.55, BOND: -0.90, PASTE: -0.05, NTC: -0.015,
  PININS: 0.55, REFLOW2: 0.40, CLEAN: -0.35, CASE: -0.55, POT: 0.30,
  CURE: -0.35, COVER: -0.60, TEST: 0.30, PACK: -0.12
};
/* 固有离散 σ（标准档 BOM、健康度 1.0）—— 与 CTQ 同量纲 */
var SIG_INTR = {
  DIEATT: 9.0, REFLOW1: 0.72, BOND: 6.5, PASTE: 1.40, NTC: 0.30,
  PININS: 0.016, REFLOW2: 4.20, CLEAN: 0.16, CASE: 0.016, POT: 0.35,
  CURE: 0.014, COVER: 0.011, TEST: 0.042, PACK: 0.012
};
/* 该站超差时产生的主缺陷 */
var MAIN_DEFECT = {
  DIEATT: 'OFFSET', REFLOW1: 'VOID', BOND: 'PULL', PASTE: 'PASTEDEV', NTC: 'NTCDEV',
  PININS: 'COPLANAR', REFLOW2: 'PINWEAK', CLEAN: 'ION', CASE: 'SEALFAIL', POT: 'BUBBLE',
  CURE: 'UNDERCURE', COVER: 'COVERFAIL', TEST: 'PARAM', PACK: 'MSL'
};

/* ---------- 科技效应 ---------- */
function techOn(id) { return !!(G && G.techs && G.techs[id]); }

function techSigmaK(procId) {
  var k = 1;
  if (procId === 'REFLOW1') { if (techOn('eq_reflow3')) k *= 0.50; else if (techOn('eq_reflow2')) k *= 0.70; }
  if (procId === 'BOND'    && techOn('eq_bonder')) k *= 0.60;
  if (procId === 'REFLOW2' && techOn('eq_r2oven')) k *= 0.62;
  if (procId === 'TEST'    && techOn('eq_tester')) k *= 0.62;
  if (techOn('eq_pdm')) k *= 0.90;
  return k;
}
function techCTK(procId) {
  var k = 1;
  if (procId === 'BOND' && techOn('eq_bonder')) k *= 0.75;
  if (procId === 'TEST' && techOn('eq_tester')) k *= 0.70;
  if ((procId === 'DIEATT' || procId === 'PININS' || procId === 'PASTE') && techOn('ef_smt')) k *= 0.70;
  if ((procId === 'POT' || procId === 'CURE') && techOn('ef_potline')) k *= 0.65;
  return k;
}
function techGRRK(procId) {
  var k = 1;
  if (techOn('q_msa')) k *= 0.55;
  if (techOn('q_xray3d') && (procId === 'XRAY1' || procId === 'XRAY2')) k *= 0.40;
  if (G && G.grrPenalty) k *= G.grrPenalty;
  return k;
}
/* 重熔安全余量：二次焊峰值必须压在 (Tm1 − margin) 以下才不会把一次焊层熔开。
   氮气回流炉的温度均匀性更好（炉膛 ΔT 从 ±8℃ 收到 ±3℃），
   所以可以把工作点更贴近 Tm1 而不越线 → margin 变小才是「变好」。
   V2 修正：此处原先返回 26（>20），等于买了好炉子反而要求更大退避，
   科技越买重熔风险越高，是符号写反的逻辑 bug。 */
function remeltMargin() { return techOn('eq_r2oven') ? 14 : 20; }

/* ---------- BOM ---------- */
function bomUnitCost() {
  var s = 0;
  for (var i = 0; i < BOM_ITEMS.length; i++) {
    var it = BOM_ITEMS[i];
    s += it.price * BOM_GRADE[(G.bom[it.id] || 'std')].pK;
  }
  return s;
}
/* 多物料共同作用时取几何平均，避免 3 项 eco 叠成 1.9³=6.9 的爆炸 */
function bomSdGeo(list) {
  if (!list || !list.length) return 1;
  var pr = 1;
  for (var i = 0; i < list.length; i++) pr *= bomSdK(list[i]);
  return Math.pow(pr, 1 / list.length);
}
function bomMuGeo(list) {
  if (!list || !list.length) return 1;
  var pr = 1;
  for (var i = 0; i < list.length; i++) pr *= bomMuK(list[i]);
  return Math.pow(pr, 1 / list.length);
}
/* 来料缺陷率 %（IQC 判据量）：按物料金额加权 */
function incomingRate() {
  var tot = 0, w = 0;
  for (var i = 0; i < BOM_ITEMS.length; i++) {
    var it = BOM_ITEMS[i], g = G.bom[it.id] || 'std';
    var r = g === 'eco' ? 1.80 : (g === 'std' ? 0.70 : 0.25);
    tot += r * it.price; w += it.price;
  }
  return w > 0 ? tot / w : 0.7;
}
function tm1() { return PREFORM_TM[G.bom.pref || 'std'] + (G.tm1Shift || 0); }

/* ---------- 物理函数派发 ---------- */
function physCall(fnName, pv, ctx) {
  switch (fnName) {
    case 'placeOffset':       return V2PHYS.placeOffset(pv);
    case 'voidRate':          return PHYS.voidRate(pv);
    case 'bondPull':          return PHYS.bondPull(pv, ctx.toolUsage, ctx.toolLimit, ctx.ion);
    case 'pasteDev':          return V2PHYS.pasteDev(pv);
    case 'ntcDev':            return V2PHYS.ntcDev(pv);
    case 'pinCoplanar':       return V2PHYS.pinCoplanar(pv);
    case 'pinSolderStrength': return V2PHYS.pinSolderStrength(pv, ctx.tm1, ctx.remeltMargin);
    case 'ionResidue':        return V2PHYS.ionResidue(pv) * ctx.pasteAct;
    /* 离子残留会污染壳体粘接界面 → 清洗站的决策在 2 站之后收账（耦合链 #2） */
    case 'sealIntegrity':     return V2PHYS.sealIntegrity(pv) - 0.060 * ctx.ion;
    case 'bubbleRate':        return V2PHYS.bubbleRate(pv);
    case 'degreeOfCure':      return PHYS.degreeOfCure(pv.cureTemp, pv.cureTime * 60);
    case 'coverFit':          return V2PHYS.coverFit(pv);
    case 'vceSat':            return V2PHYS.vceSat(pv) - 0.55 * (ctx.muK - 1);
    case 'packIntegrity':     return V2PHYS.packIntegrity(pv, ctx.humidity);
  }
  return 0;
}
function clonePV(pv) { var o = {}; for (var k in pv) o[k] = pv[k]; return o; }

/* 【田口稳健性】噪声传递：|dY/dX| × 输入噪声幅值。
   工作点选在响应面驻点 → 斜率趋零 → 同样的设备漂移传不到 CTQ 上。
   这是「均值达标 ≠ CPK 达标」的物理根源，也是本作最深的策略杠杆。 */
function transVar(fnName, pv, key, amp, ctx) {
  var a = clonePV(pv), b = clonePV(pv);
  a[key] = pv[key] + amp; b[key] = pv[key] - amp;
  var ya = physCall(fnName, a, ctx), yb = physCall(fnName, b, ctx);
  if (!isFinite(ya) || !isFinite(yb)) return 0;
  return Math.abs(ya - yb) / 2;
}

/* ---------- 建局 ---------- */
function defaultBom(lv) {
  var b = {};
  for (var i = 0; i < BOM_ITEMS.length; i++) b[BOM_ITEMS[i].id] = 'std';
  if (lv && lv.forceEco) for (var j = 0; j < lv.forceEco.length; j++) b[lv.forceEco[j]] = 'eco';
  return b;
}

function newGame(levelIdx, carry) {
  carry = carry || {};
  var lv = LEVELS[levelIdx];
  RNG.seed(20260808 + levelIdx * 7919 + Math.floor(Math.random() * 100000));

  G = {
    lvIdx: levelIdx, lv: lv,
    t: 0, running: false, over: false, speed: 1,
    money: (carry.money === undefined ? 260000 : carry.money),
    rep: (carry.rep === undefined ? 70 : carry.rep),
    techs: carry.techs ? JSON.parse(JSON.stringify(carry.techs)) : {},
    bom: defaultBom(lv),
    lockedBom: (lv.forceEco || []).slice(),
    procs: [],
    released: 0, shipped: 0, scrapped: 0, reworked: 0, escaped: 0, downgraded: 0,
    rejectedLots: 0, overkill: 0, missed: 0, inspected: 0,
    matCost: 0, laborCost: 0,
    paf: { P: 0, A: 0, IF: 0, EF: 0 },
    humidity: lv.humidity, dryer: false, dryerSec: 0,
    moistureH: 0,
    overtime: false, slowdown: 0, freeze: 0,
    grrPenalty: 1, tm1Shift: 0, claimK: 1, revBonus: 0,
    nextEvent: 42 + RNG.u() * 26, evtDone: {}, pendingEvent: null,
    log: [], trace: [], defectTally: {},
    seq: 0, result: null, tSpent: 0
  };

  for (var i = 0; i < PROC_DEFS.length; i++) {
    var d = PROC_DEFS[i];
    var pv = {};
    if (d.params) for (var q = 0; q < d.params.length; q++) pv[d.params[q].k] = d.params[q].def;
    var p = {
      idx: i, d: d, pv: pv,
      thr: d.gate ? d.gate.thrDef : null,
      cov: d.gate ? (d.id === 'TEST' ? 'full' : 'n13') : null,
      band: d.gate ? (d.gate.thrMax - d.gate.thrMin) : 0,
      sampling: (d.kind === 'proc') ? 'n5' : null,
      chart: null,
      machine: {
        health: 1, drift: 0, sigmaK: 1,
        driftRate: (DRIFT_RATE[d.id] || 0) / 60,
        lastPM: 0, down: 0, downCount: 0
      },
      reworking: false, tighten: 0,
      toolUsage: 0, toolLimit: 33000,
      queue: [], busy: null, busyLeft: 0, blocked: false,
      buf: BUF_DEFAULT + (techOn('ef_conveyor') ? 6 : 0),
      cnt: 0, scrap: 0, rework: 0, judgedBad: 0, ok: 0,
      overkill: 0, missed: 0, inspected: 0,
      lastVal: null, ctTotal: 0, viols: 0
    };
    if (d.fn) {
      p.chart = new ControlChart(d.ctqLabel, 4, d.lsl, d.usl, d.ctqUnit, d.lowerBetter);
      p.chart.baselineNeed = 5;
    }
    G.procs.push(p);
  }
  logMsg('sys', '关卡 ' + lv.id + '「' + lv.name + '」就绪 · ' + PRICE[lv.grade].name +
    ' × ' + lv.qty + ' 件 · CPK≥' + lv.cpk.toFixed(2) + ' · 逃逸红线 ' + (lv.escLimit * 100).toFixed(1) + '%');
  return G;
}

function procById(id) {
  for (var i = 0; i < G.procs.length; i++) if (G.procs[i].d.id === id) return G.procs[i];
  return null;
}
function logMsg(kind, text) {
  G.log.unshift({ k: kind, t: G.t, s: text });
  if (G.log.length > 160) G.log.pop();
}
function fmt(v, n) {
  if (v === null || v === undefined || !isFinite(v)) return '—';
  return v.toFixed(n === undefined ? 2 : n);
}
function money(v) {
  var s = Math.abs(Math.round(v)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (v < 0 ? '-¥' : '¥') + s;
}

/* ---------- 节拍 ---------- */
function ctScale(p) {
  var v = p.pv, id = p.d.id;
  switch (id) {
    case 'DIEATT': return 1.55 - 0.55 * (v.placeSpeed / 12);
    case 'REFLOW1': return 0.55 + 0.45 * (v.soakTime / 75);
    case 'REFLOW2': return 0.55 + 0.45 * (v.dwellTime2 / 55);
    case 'CLEAN':   return 0.60 + 0.40 * (v.rinseTime / 40);
    case 'POT':     return 0.50 + 0.50 * (v.degasTime / 60);
    case 'CURE':    return 0.45 + 0.55 * (v.cureTime / 100);
    case 'TEST':    return 0.50 + 0.50 * (v.burnTime / 4);
    default: return 1;
  }
}
function procCT(p) {
  var base = p.d.ct * ctScale(p) * techCTK(p.d.id) * TSCALE;
  if (p.d.kind === 'gate') base *= (1 + 0.55 * (SAMPLING[p.cov] ? SAMPLING[p.cov].rate : 0));
  else base *= (SAMPLING[p.sampling] ? SAMPLING[p.sampling].ctK : 1);
  var m = p.machine;
  base /= Math.max(0.45, m.health);
  if (G.overtime) base /= COST.overtimeK;
  if (G.slowdown > 0) base *= 1.18;
  return Math.max(0.15, base);
}
function bottleneckCT() {
  var mx = 0;
  for (var i = 0; i < G.procs.length; i++) { var c = procCT(G.procs[i]); if (c > mx) mx = c; }
  return mx;
}
function bottleneckIdx() {
  var mx = -1, bi = 0;
  for (var i = 0; i < G.procs.length; i++) { var c = procCT(G.procs[i]); if (c > mx) { mx = c; bi = i; } }
  return bi;
}

/* ---------- 工位求值 ---------- */
function evalProcess(p, b) {
  var d = p.d, m = p.machine;
  var pv = clonePV(p.pv);
  var dk = DRIFT_KEY[d.id];
  if (dk && pv[dk] !== undefined) pv[dk] += m.drift;

  var ctx = {
    tm1: tm1(), humidity: G.dryer ? 45 : G.humidity,
    toolUsage: p.toolUsage, toolLimit: p.toolLimit,
    ion: b.ionNorm || 0, pasteAct: b.pasteAct || 1,
    muK: bomMuGeo(d.bom), remeltMargin: remeltMargin()
  };

  var mu = physCall(d.fn, pv, ctx);
  if (!isFinite(mu)) mu = 0;

  /* σ = √(传递方差 + 固有方差) */
  var sigK = (m.sigmaK || 1) / Math.max(0.35, m.health) * techSigmaK(d.id)
           * (G.overtime ? 1.22 : 1) * (G.slowdown > 0 ? 1.30 : 1);
  var vTrans = 0;
  if (d.params) {
    for (var i = 0; i < d.params.length; i++) {
      var pr = d.params[i];
      var amp = (pr.max - pr.min) * 0.02 * sigK;   // 设备重复性 ≈ 量程 2%
      var s = transVar(d.fn, pv, pr.k, amp, ctx);
      vTrans += s * s;
    }
  }
  var sigI = (SIG_INTR[d.id] || 0.01) * bomSdGeo(d.bom) * sigK;
  var sigma = Math.sqrt(vTrans + sigI * sigI);
  var val = RNG.normal(mu, sigma);

  /* 物理下限约束（率类不可为负） */
  if (d.id === 'REFLOW1' || d.id === 'POT' || d.id === 'PASTE' || d.id === 'NTC' ||
      d.id === 'CLEAN' || d.id === 'DIEATT' || d.id === 'PININS') val = Math.max(0.001, val);
  if (d.id === 'BOND' || d.id === 'REFLOW2') val = Math.max(0, val);

  var defects = [];
  var bad = d.lowerBetter ? (val > d.usl) : (val < d.lsl);
  if (bad) defects.push(MAIN_DEFECT[d.id]);

  /* ---- 站点专属的伴生失效 ---- */
  if (d.id === 'REFLOW1') {
    var cold = PHYS.coldJointRate(pv) / 100;
    if (RNG.u() < clamp(cold, 0, 0.6)) defects.push('COLD');
    var adhesion = 0.72 + 0.18 * bomMuK('dbc');
    var dp = PHYS.delamProb(G.moistureH, pv.peakTemp, adhesion);
    /* 分层概率 → SAM 可测的分层面积占比 %。1.6/55 由「干燥件 2.5% / 临界件 8%」两点标定 */
    var delamArea = Math.max(0.3, RNG.normal(1.6 + 55 * dp, 0.55));
    b.ctq.delam = delamArea;
    if (delamArea > 8.0) defects.push('DELAM');
    b.fp.REFLOW1 = { T: pv.peakTemp, V: pv.vacuum, t: pv.soakTime, R: pv.rampRate };
  }
  if (d.id === 'REFLOW2') {
    var rm = V2PHYS.remeltRisk(pv.peakTemp2, ctx.tm1, remeltMargin());
    b.remelt = rm;
    if (RNG.u() < rm * 0.35) defects.push('SHIFT');
    b.ctq.pinVoid = Math.max(0.4, RNG.normal(V2PHYS.pinVoid(val), 0.9));
    b.fp.REFLOW2 = { T2: pv.peakTemp2, t2: pv.dwellTime2, Tm1: ctx.tm1, rm: rm };
  }
  if (d.id === 'BOND') {
    p.toolUsage += 1;
    if (RNG.u() < 0.004 + 0.020 * clamp(p.toolUsage / p.toolLimit, 0, 1)) defects.push('LIFTOFF');
    b.fp.BOND = { P: pv.usPower, t: pv.bondTime, F: pv.bondForce, wear: p.toolUsage };
  }
  if (d.id === 'CLEAN') b.ionNorm = clamp((val - 0.4) / 2.2, 0, 1);
  /* 锡膏活性：经济档助焊剂活性强、残留基数大 */
  if (d.id === 'PASTE') b.pasteAct = clamp(2 - bomMuK('paste') + 0.06 * (val / 3.2 - 1), 0.7, 1.4);

  return { val: val, mu: mu, sigma: sigma, defects: defects };
}

/* ---------- 抽检（加工站） ---------- */
function detectProb(sampling, isSys) {
  var s = SAMPLING[sampling];
  if (!s) return 0;
  return isSys ? s.det.sysDet : s.det.rndDet;
}
function inspectProc(p, b, newDefects) {
  var s = SAMPLING[p.sampling];
  if (!s || s.rate <= 0) return;
  var doInspect = (s.rate >= 1) || (RNG.u() < s.rate);
  if (!doInspect) return;
  p.inspected++; G.inspected++;
  G.paf.A += COST.inspUnit * (s.id === 'destruct' ? 3.2 : 1);
  if (s.id === 'destruct' && RNG.u() < 0.5) {   // 破坏性抽检本身销毁样品
    G.paf.A += bomUnitCost() * 0.35;
  }
  for (var i = 0; i < newDefects.length; i++) {
    var dc = DEFECTS[newDefects[i]];
    if (!dc) continue;
    if (RNG.u() < detectProb(p.sampling, dc.sys)) {
      return { caught: dc };
    }
  }
  return null;
}

/* ---------- 检测门 ---------- */
function gateTrueValue(p, b) {
  var g = p.d.gate;
  switch (g.target) {
    case 'incoming': return b.ctq.incoming;
    case 'REFLOW1':  return b.ctq.REFLOW1;
    case 'delam':    return b.ctq.delam;
    case 'pinVoid':  return b.ctq.pinVoid;
    case 'TEST':     return b.ctq.TEST;
  }
  return null;
}
function gateGRR(p) {
  return p.d.gate.grrPct * p.band * techGRRK(p.d.id);
}

/* 返回 'pass' | 'scrap' | 'rework' */
function handleGate(p, b) {
  var d = p.d, g = d.gate;

  /* TEST 站既是门也是加工站：先跑老化工艺产生 Vce */
  if (d.fn) {
    var r = evalProcess(p, b);
    b.ctq[d.id] = r.val; p.lastVal = r.val;
    if (p.chart) { var sg = p.chart.push(r.val); if (sg && sg.viol && sg.viol.length) onViolation(p, sg); }
    for (var k = 0; k < r.defects.length; k++) if (b.defects.indexOf(r.defects[k]) < 0) b.defects.push(r.defects[k]);
    /* 老化会真实筛除早期失效：把已存在的 sev>=2 缺陷按筛出率剔除并转为内部失效 */
    var scr = PHYS.burnInScreen(p.pv.burnTime * (0.7 + 0.3 * p.pv.burnTemp / 125));
    if (b.defects.length && RNG.u() < scr * 0.55) {
      b.burnCaught = true;
    }
  }

  var cov = SAMPLING[p.cov] || SAMPLING.none;
  /* 加严检验期内强制全检（GB/T 2828 转移规则） */
  var effRate = (p.tighten > 0) ? 1 : cov.rate;
  var doInspect = (effRate >= 1) || (RNG.u() < effRate);

  /* 老化筛出的件即便免检也会因功能失效被拦下 */
  if (!doInspect && !b.burnCaught) return 'pass';

  if (doInspect) {
    p.inspected++; G.inspected++;
    var unit = g.unitCost + (techOn('q_xray3d') && (d.id === 'XRAY1' || d.id === 'XRAY2') ? 1.8 : 0);
    G.paf.A += unit;
  }

  var tv = gateTrueValue(p, b);
  if (tv === null || tv === undefined || !isFinite(tv)) tv = null;

  var jr = (doInspect && tv !== null)
    ? V2PHYS.gateJudge(tv, p.thr, gateGRR(p), d.lowerBetter)
    : { measured: tv, bad: !doInspect };      // 老化功能失效：必判坏

  var trulyBad = (tv !== null) && (d.lowerBetter ? (tv > d.usl) : (tv < d.lsl));

  /* ---- 属性型缺陷检出 ----
     连续量判据管不到「虚焊 / 分层 / 键合脱落 / 盖板未到位」这类属性缺陷：
     它们不是超差，而是有或没有。能不能抓到取决于这道门的覆盖率与缺陷性质
     （系统性缺陷连片出现，抽检易撞上；偶发缺陷只有全检才拦得住）。
     这才是「全检 vs 抽检」真正的价值来源——V2 修正前属性缺陷 100% 逃逸。 */
  var attrCaught = null;
  var owns = false;
  for (var i = 0; i < b.defects.length; i++) {
    var dc = DEFECTS[b.defects[i]];
    if (!dc || dc.gate !== d.id) continue;
    owns = true;
    if (doInspect && !attrCaught && RNG.u() < detectProb(p.cov, dc.sys)) attrCaught = dc;
  }
  /* 抽检撞见系统性缺陷 → 判定为批次性问题，转加严检验。
     这让 n=13 不只是「省钱的全检」，而是一个能触发升级响应的传感器。 */
  if (attrCaught && attrCaught.sys && cov.rate < 1 && p.tighten <= 0) {
    p.tighten = COST.tightenSec;
    logMsg('warn', '⚑ ' + d.short + ' 抽检发现批次性「' + attrCaught.n + '」→ 转加严检验 ' + COST.tightenSec + 's');
  }

  var reallyDefective = trulyBad || owns;

  if (jr.bad || attrCaught) {
    p.judgedBad++;
    if (!reallyDefective) { p.overkill++; G.overkill++; }
    /* 判坏的处置：只带轻微缺陷 → 返修；否则报废 */
    var worst = 0;
    for (var j = 0; j < b.defects.length; j++) {
      var dd = DEFECTS[b.defects[j]];
      if (dd && dd.sev > worst) worst = dd.sev;
    }
    if (d.id === 'IQC') return 'reject';
    if (worst === 1) return 'rework';
    if (worst === 0) return 'scrap';          // 过杀：好件被扔
    return 'scrap';
  } else {
    if (reallyDefective && doInspect) { p.missed++; G.missed++; }
    return 'pass';
  }
}

/* ---------- 判异 ---------- */
function onViolation(p, sg) {
  p.viols++;
  var rules = sg.viol.join('+');
  var repLoss = 0.6 * (techOn('q_spcauto') ? 0.6 : 1);
  G.rep = clamp(G.rep - repLoss, 0, 100);
  logMsg('warn', '⚠ ' + p.d.short + ' 控制图判异 ' + rules +
    '（X̄=' + fmt(sg.xbar, 3) + '）' + (techOn('q_spcauto') ? ' · 已自动记录工艺指纹' : ''));
}

/* ---------- 投料 / 流转 ---------- */
function makeBatch() {
  G.seq++;
  var b = {
    id: G.seq, born: G.t, defects: [], ctq: {}, fp: {},
    moistureH: G.moistureH, remelt: 0, burnCaught: false,
    bomSnapshot: JSON.parse(JSON.stringify(G.bom)),
    ionNorm: 0, pasteAct: 1
  };
  var ir = incomingRate();
  b.ctq.incoming = Math.max(0, RNG.normal(ir, ir * 0.45 + 0.12));
  if (b.ctq.incoming > 2.0) b.defects.push('INCOMING');
  G.matCost += bomUnitCost();
  G.released++;
  return b;
}

/* 报废在该工位造成的「内部失效成本」= 已投入加工价值 + 处置费。
   物料本身不在这里计——它在投料时已经进 matCost 了；这里只把可回收的残值
   反冲回去（越靠后报废，芯片越难从灌封件里取出来，回收率越低）。 */
function investedCost(pi) {
  var prog = pi / (PROC_DEFS.length - 1);
  return COST.vaPerPiece * (0.25 + 0.75 * prog);
}
function salvageAt(pi) {
  var prog = pi / (PROC_DEFS.length - 1);
  return bomUnitCost() * COST.scrapRecover * (1 - 0.62 * prog);
}

function scrapAt(pi, b, why) {
  var p = G.procs[pi];
  p.scrap++; G.scrapped++;
  G.paf.IF += investedCost(pi) + COST.scrapHandle;
  G.matCost -= salvageAt(pi);
  tally(b);
  logMsg('bad', '✖ ' + p.d.short + ' 报废 #' + b.id + (why ? '（' + why + '）' : ''));
}
function reworkAt(pi, b) {
  var p = G.procs[pi];
  p.rework++; G.reworked++;
  G.paf.IF += COST.reworkCost;
  /* 返修消除 sev==1 缺陷 */
  var keep = [];
  for (var i = 0; i < b.defects.length; i++) {
    var dc = DEFECTS[b.defects[i]];
    if (dc && dc.sev >= 2) keep.push(b.defects[i]);
  }
  b.defects = keep;
  p.busyLeft = procCT(p) * COST.reworkTimeK;
}
function rejectLot(b) {
  G.rejectedLots++;
  G.paf.IF += bomUnitCost() * 0.15;       // 退货手续+运费，物料本身退回
  G.matCost -= bomUnitCost() * 0.85;
  logMsg('warn', '⟲ IQC 退货 #' + b.id + '（来料 ' + fmt(b.ctq.incoming, 2) + '%）');
}
function tally(b) {
  for (var i = 0; i < b.defects.length; i++) {
    G.defectTally[b.defects[i]] = (G.defectTally[b.defects[i]] || 0) + 1;
  }
}

function shipBatch(b) {
  var lv = G.lv, pr = PRICE[lv.grade];
  var worst = 0;
  for (var i = 0; i < b.defects.length; i++) {
    var dc = DEFECTS[b.defects[i]];
    if (dc && dc.sev > worst) worst = dc.sev;
  }
  G.shipped++;
  tally(b);
  G.trace.push({
    id: b.id, t: G.t, defects: b.defects.slice(), fp: b.fp,
    ctq: { void: b.ctq.REFLOW1, delam: b.ctq.delam, pinV: b.ctq.pinVoid, vce: b.ctq.TEST },
    bom: b.bomSnapshot, grade: worst
  });
  if (G.trace.length > 400) G.trace.shift();

  if (worst >= 2) {
    G.escaped++;
    var claim = pr.unit * pr.claimMult * G.claimK;
    G.paf.EF += claim;
    G.rep = clamp(G.rep - 2.2, 0, 100);
    logMsg('bad', '☠ 逃逸出货 #' + b.id + ' → 客户索赔 ' + money(claim) +
      '（' + b.defects.map(function (x) { return DEFECTS[x] ? DEFECTS[x].n : x; }).join('/') + '）');
  } else if (worst === 1) {
    G.downgraded++;
    G.paf.EF += pr.unit * (1 - pr.downgrade);
  }
}

function pushNext(pi, b) {
  if (pi >= G.procs.length - 1) { shipBatch(b); return true; }
  var nx = G.procs[pi + 1];
  if (nx.queue.length >= nx.buf) return false;
  nx.queue.push(b);
  return true;
}

/* ---------- 单站推进 ---------- */
function stepProcess(pi, dt) {
  var p = G.procs[pi], m = p.machine;

  if (m.down > 0) { m.down -= dt; if (m.down <= 0) { m.down = 0; logMsg('sys', p.d.short + ' 恢复运行'); } return; }

  if (p.blocked && p.busy) {
    if (pushNext(pi, p.busy)) { p.busy = null; p.blocked = false; }
    else return;
  }
  if (!p.busy) {
    if (!p.queue.length) return;
    p.busy = p.queue.shift();
    p.busyLeft = procCT(p);
    p.ctTotal += p.busyLeft;
  }
  p.busyLeft -= dt;
  if (p.busyLeft > 0) return;

  var b = p.busy;

  /* 返修占用的额外工时走完后直接出站，不得重复求值（否则同一件会被反复判定） */
  if (p.reworking) {
    p.reworking = false;
    p.ok++;
    if (pushNext(pi, b)) p.busy = null; else p.blocked = true;
    return;
  }

  p.cnt++;
  var disposition = 'pass';

  if (p.d.kind === 'gate') {
    disposition = handleGate(p, b);
  } else {
    var r = evalProcess(p, b);
    b.ctq[p.d.id] = r.val; p.lastVal = r.val;
    if (p.chart) { var sg = p.chart.push(r.val); if (sg && sg.viol && sg.viol.length) onViolation(p, sg); }
    var fresh = [];
    for (var i = 0; i < r.defects.length; i++) {
      if (b.defects.indexOf(r.defects[i]) < 0) { b.defects.push(r.defects[i]); fresh.push(r.defects[i]); }
    }
    var hit = inspectProc(p, b, fresh);
    if (hit && hit.caught) {
      disposition = hit.caught.sev === 1 ? 'rework' : 'scrap';
      logMsg('warn', '◆ ' + p.d.short + ' 抽检拦截 ' + hit.caught.n + ' #' + b.id);
    }
  }

  if (disposition === 'scrap') { scrapAt(pi, b, null); p.busy = null; p.reworking = false; return; }
  if (disposition === 'reject') { rejectLot(b); p.busy = null; p.reworking = false; return; }
  if (disposition === 'rework') { reworkAt(pi, b); p.reworking = true; return; }

  p.ok++;
  if (pushNext(pi, b)) p.busy = null;
  else p.blocked = true;
}

/* ============================================================
   UI 预测接口 —— 渲染层不必重复构造物理上下文
   ============================================================ */

/* 当前（或假想）参数下的 CTQ 均值 / σ / 预估 CPK / 各参数噪声传递贡献 */
function predictProc(p, overridePV) {
  var d = p.d;
  if (!d.fn) return null;
  var pv = clonePV(overridePV || p.pv);
  var m = p.machine;
  var ctx = {
    tm1: tm1(), humidity: G.dryer ? 45 : G.humidity,
    toolUsage: p.toolUsage, toolLimit: p.toolLimit,
    ion: 0.35, pasteAct: 1, muK: bomMuGeo(d.bom), remeltMargin: remeltMargin()
  };
  var mu = physCall(d.fn, pv, ctx);
  if (!isFinite(mu)) mu = 0;

  var sigK = (m.sigmaK || 1) / Math.max(0.35, m.health) * techSigmaK(d.id)
           * (G.overtime ? 1.22 : 1) * (G.slowdown > 0 ? 1.30 : 1);
  var vTrans = 0, byParam = [];
  if (d.params) {
    for (var i = 0; i < d.params.length; i++) {
      var pr = d.params[i];
      var amp = (pr.max - pr.min) * 0.02 * sigK;
      var s = transVar(d.fn, pv, pr.k, amp, ctx);
      vTrans += s * s;
      byParam.push({ k: pr.k, n: pr.n, s: s });
    }
  }
  var sigI = (SIG_INTR[d.id] || 0.01) * bomSdGeo(d.bom) * sigK;
  var sigma = Math.sqrt(vTrans + sigI * sigI);

  /* 传递方差占总方差的比例 —— 田口稳健性的直观读数 */
  var totV = vTrans + sigI * sigI;
  for (var j = 0; j < byParam.length; j++) {
    byParam[j].share = totV > 0 ? (byParam[j].s * byParam[j].s) / totV : 0;
  }
  byParam.sort(function (a, b2) { return b2.s - a.s; });

  var cpk = null;
  if (sigma > 1e-9) {
    var up = isFinite(d.usl) ? (d.usl - mu) / (3 * sigma) : Infinity;
    var lo = isFinite(d.lsl) ? (mu - d.lsl) / (3 * sigma) : Infinity;
    cpk = Math.min(up, lo);
    if (!isFinite(cpk)) cpk = 9.99;
  }
  return {
    mu: mu, sigma: sigma, cpk: cpk, byParam: byParam,
    transShare: totV > 0 ? vTrans / totV : 0, intrinsic: sigI
  };
}

/* 扫描某个参数，返回响应曲线（供 UI 画 U 型 / 倒 U 型响应面） */
function scanParam(p, key, n) {
  var d = p.d;
  if (!d.fn || !d.params) return null;
  var pr = null;
  for (var i = 0; i < d.params.length; i++) if (d.params[i].k === key) pr = d.params[i];
  if (!pr) return null;
  n = n || 42;
  var pts = [], pv = clonePV(p.pv);
  var ctx = {
    tm1: tm1(), humidity: G.dryer ? 45 : G.humidity,
    toolUsage: p.toolUsage, toolLimit: p.toolLimit,
    ion: 0.35, pasteAct: 1, muK: bomMuGeo(d.bom), remeltMargin: remeltMargin()
  };
  for (var s = 0; s <= n; s++) {
    var x = pr.min + (pr.max - pr.min) * (s / n);
    pv[key] = x;
    var y = physCall(d.fn, pv, ctx);
    if (!isFinite(y)) y = 0;
    /* 同时给出该点的噪声传递斜率，UI 用它画「稳健带」 */
    var amp = (pr.max - pr.min) * 0.02;
    pts.push({ x: x, y: y, slope: transVar(d.fn, pv, key, amp, ctx) });
  }
  return { param: pr, pts: pts, cur: p.pv[key] };
}

/* 检测门的 α（过杀）/ β（漏检）预测 —— 阈值滑块的即时反馈 */
function predictGate(p) {
  var d = p.d;
  if (d.kind !== 'gate') return null;
  var stat = gateStat(p);
  if (!stat) return null;
  var ab = V2PHYS.alphaBeta(stat.mu, stat.sd, d.lowerBetter ? d.usl : d.lsl,
                            p.thr, d.lowerBetter);
  var cov = SAMPLING[p.cov] || SAMPLING.none;
  return {
    mu: stat.mu, sd: stat.sd, alpha: ab.alpha, beta: ab.beta,
    grr: gateGRR(p), cov: cov.rate,
    /* 实际逃逸 ≈ β + 未抽到的部分 */
    escapeEst: clamp(ab.beta * cov.rate + (1 - cov.rate), 0, 1),
    overkillEst: clamp(ab.alpha * cov.rate, 0, 1)
  };
}

/* 门的入料分布估计：优先用真实历史，无历史时退回上游工位的理论分布 */
function gateStat(p) {
  var d = p.d, tgt = d.gate.target;
  var src = null;
  if (tgt === 'REFLOW1') src = procById('REFLOW1');
  else if (tgt === 'delam') src = procById('REFLOW1');
  else if (tgt === 'pinVoid') src = procById('REFLOW2');
  else if (tgt === 'TEST') src = procById('TEST');

  if (tgt === 'incoming') {
    var r = incomingRate();
    return { mu: r, sd: Math.max(0.08, r * 0.42) };
  }
  if (!src) return null;

  if (tgt === 'delam') {
    /* 分层面积没有独立控制图，用湿度/黏附经验式给分布 */
    var mo = clamp(G.moistureH / 100, 0, 1);
    return { mu: 1.8 + 5.2 * mo, sd: 0.9 + 1.6 * mo };
  }
  if (tgt === 'pinVoid') {
    var pr2 = predictProc(src);
    if (!pr2) return null;
    return { mu: V2PHYS.pinVoid(pr2.mu), sd: Math.max(0.5, 0.32 * pr2.sigma + 0.9) };
  }
  var pr3 = predictProc(src);
  if (!pr3) return null;
  return { mu: pr3.mu, sd: Math.max(1e-6, pr3.sigma) };
}


/* ------------------------------------------------------------ */

/* ============================================================
   V2 主循环层 —— tick / 设备老化 / 湿度 / 事件 / PAF 四维结算 / 存档
   ============================================================ */
'use strict';

var LS_SCORE = 'igbt_v2_scores';
var LS_PROG  = 'igbt_v2_prog';
var LS_SAVE  = 'igbt_v2_save';

/* ---------- 主循环 ---------- */
function tick(dtReal) {
  if (!G || !G.running || G.over) return;
  if (G.pendingEvent) return;                    // 事件窗口冻结产线
  var dt = dtReal * G.speed;
  if (dt <= 0) return;
  if (dt > 0.5) dt = 0.5;                        // 防后台标签页时间跳变
  G.t += dt; G.tSpent += dt;

  /* --- 成本：产线在跑就在烧钱 --- */
  G.laborCost += COST.laborPerSec * dt * (G.overtime ? (1 + COST.overtimeCost / COST.laborPerSec) : 1);
  if (G.dryer) { G.dryerSec += dt; G.paf.P += (COST.dryerCost / 60) * dt * (techOn('q_dryer') ? 0.6 : 1); }

  /* --- 吸湿动力学 ---
     指数 4.0：45→58%RH 只差 2.8 倍，58→82%RH 差 4 倍。
     这个陡度让「梅雨季」成为必须专门应对的关卡，而常规湿度不构成威胁。
     absorbK 0.054 标定：58%RH × 600s ≈ 40 等效小时（分层面积 3.3%，安全）
                        82%RH × 360s ≈ 96 等效小时（分层面积 8.3%，越线） */
  var humEff = G.dryer ? 45 : G.humidity;
  var absorbK = 0.054 * (techOn('q_dryer') && G.dryer ? 0.6 : 1);
  G.moistureH += dt * Math.pow(humEff / 55, 4.0) * absorbK;

  if (G.slowdown > 0) G.slowdown = Math.max(0, G.slowdown - dt);

  /* --- 设备漂移与老化 --- */
  for (var i = 0; i < G.procs.length; i++) {
    var p = G.procs[i], m = p.machine;
    if (p.tighten > 0) {
      p.tighten -= dt;
      if (p.tighten <= 0) { p.tighten = 0; logMsg('sys', p.d.short + ' 加严检验结束，恢复正常抽检'); }
    }
    if (m.down > 0) continue;
    m.drift += m.driftRate * dt * (techOn('eq_pdm') ? 0.6 : 1);
    m.health = Math.max(0.42, m.health - dt * 0.00042 * (techOn('eq_pdm') ? 0.45 : 1));
    /* 非计划停机：健康度越低概率越高 */
    var pf = dt * 0.00055 * (1 - m.health) * (techOn('eq_pdm') ? 0.45 : 1);
    if (RNG.u() < pf) {
      m.down = 6 + RNG.u() * 10; m.downCount++;
      G.paf.IF += COST.downCost;
      logMsg('bad', '⛔ ' + p.d.short + ' 非计划停机 ' + m.down.toFixed(0) + 's（−' + money(COST.downCost) + '）');
    }
  }

  /* --- 投料：按瓶颈节拍节流 + 在制量封顶 ---
     18 个工位的流水线如果无脑灌料，订单完成时线上会留下几十件在制品，
     这些料都付过钱却永远出不了货 —— 单件成本会被这批「沉没在制」直接顶穿。
     所以在制量以「剩余需求 + 一个流水线身位」封顶：既不断料，也不过量投产。 */
  var first = G.procs[0];
  var need = G.lv.qty + Math.ceil(G.lv.qty * 0.45) + 8;
  var stillNeed = G.lv.qty - G.shipped;
  var wipCap = stillNeed + 5;
  if (G.released < need && stillNeed > 0 && wipCount() < wipCap && first.queue.length < first.buf) {
    /* 投料略快于瓶颈（×0.80），让报废造成的缺口有机会补回 */
    G.relAcc = (G.relAcc || 0) + dt;
    var bct = bottleneckCT() * 0.80;
    if (G.relAcc >= bct) { G.relAcc -= bct; first.queue.push(makeBatch()); }
  }

  /* --- 逐站推进（从后往前，避免同一 tick 内穿透多站） --- */
  for (var k = G.procs.length - 1; k >= 0; k--) stepProcess(k, dt);

  /* --- 事件调度 --- */
  G.nextEvent -= dt;
  if (G.nextEvent <= 0) { triggerEvent(); G.nextEvent = 55 + RNG.u() * 45; }

  /* --- 结束条件 --- */
  if (G.shipped >= G.lv.qty) { finish(true); return; }
  if (G.t >= G.lv.timeLimit) { finish(false); return; }
  /* 物料投完且线上无在制 → 提前结束 */
  if (G.released >= need && wipCount() === 0) { finish(false); return; }
}

function wipCount() {
  var n = 0;
  for (var i = 0; i < G.procs.length; i++) { n += G.procs[i].queue.length + (G.procs[i].busy ? 1 : 0); }
  return n;
}

/* ---------- 事件 ---------- */
function triggerEvent() {
  if (G.pendingEvent) return;
  var pool = [];
  for (var i = 0; i < EVENTS.length; i++) {
    var e = EVENTS[i];
    if (e.minLv > G.lv.id) continue;
    if (G.evtDone[e.id]) continue;
    for (var w = 0; w < e.w; w++) pool.push(e);
  }
  if (!pool.length) return;
  var ev = RNG.pick(pool);
  G.evtDone[ev.id] = true;
  G.pendingEvent = ev;
  logMsg('evt', '❗ ' + ev.title);
}

function resolveEvent(optIdx) {
  var ev = G.pendingEvent;
  if (!ev) return;
  var o = ev.opts[optIdx];
  G.pendingEvent = null;
  if (!o) return;
  var p;
  switch (o.f) {
    case 'calib':
      p = procById('REFLOW1'); p.machine.drift = 0; p.machine.down = 24;   // 停机校准 24 游戏秒
      G.paf.P += 180; if (p.chart) p.chart.resetBaseline();
      logMsg('sys', '已停机校准：一次焊漂移归零，控制限需重建基线'); break;
    case 'compensate':
      p = procById('REFLOW1'); p.pv.peakTemp = clamp(p.pv.peakTemp - 6, 225, 275);
      logMsg('sys', '已调参补偿：峰值温度 −6℃，漂移仍在累积'); break;
    case 'ignore':
      p = procById('REFLOW1'); p.machine.driftRate *= 2.1;
      logMsg('warn', '继续生产：一次焊漂移速率翻倍'); break;

    case 'swapPref':
      G.money -= 2600; G.tm1Shift = 0; G.freeze = 20;   // 换料全线停 20s
      G.paf.P += 2600; logMsg('sys', '已换料：Tm1 恢复标称 ' + tm1() + '℃'); break;
    case 'lowerT2':
      p = procById('REFLOW2'); p.pv.peakTemp2 = clamp(p.pv.peakTemp2 - 12, 195, 250);
      logMsg('sys', '二次焊峰值 −12℃ 保守运行'); break;
    case 'riskPref':
      G.tm1Shift = -15; logMsg('warn', '照常生产：Tm1 按 ' + tm1() + '℃ 计，重熔风险上升'); break;

    case 'rushYes':
      G.overtime = true; G.revBonus += 0.06; G.lv2Rush = true;
      logMsg('sys', '接单加班：节拍 ×' + COST.overtimeK + '，订单额 +6%'); break;
    case 'rushNo':
      G.rep = clamp(G.rep - 3, 0, 100); logMsg('sys', '婉拒催货，声誉 −3'); break;

    case 'msaFix':
      G.grrPenalty = 1; G.money -= 900; G.paf.P += 900; G.freeze = 20;   // MSA 复检全线停 20s
      logMsg('sys', 'MSA 完成：所有检测门 GRR 恢复'); break;
    case 'msaSkip':
      G.grrPenalty = 1.8; logMsg('warn', '带病运行：所有门 GRR ×1.8，α/β 同时恶化'); break;

    case 'dryerOn':
      G.dryer = true; logMsg('sys', '干燥柜启动：有效湿度按 45%RH 计，¥45/min'); break;
    case 'lowerReflow':
      p = procById('REFLOW1'); p.pv.peakTemp = clamp(p.pv.peakTemp - 8, 225, 275);
      logMsg('sys', '一次焊峰值 −8℃：爆米花风险下降，空洞率上升'); break;
    case 'humidIgnore':
      G.humidity = Math.min(95, G.humidity + 10); logMsg('warn', '硬扛：车间湿度升至 ' + G.humidity + '%RH'); break;

    case 'auditYes':
      G.freeze = 26; G.rep = clamp(G.rep + 8, 0, 100);
      logMsg('sys', '全线暂停配合审核，声誉 +8'); break;
    case 'auditHalf':
      G.slowdown = 40; G.rep = clamp(G.rep + 3, 0, 100);
      logMsg('sys', '边生产边配合，节拍下降，声誉 +3'); break;
    case 'auditNo':
      G.rep = clamp(G.rep - 12, 0, 100); G.claimK *= 1.15;
      logMsg('warn', '推迟审核：声誉 −12，本关索赔倍率 ×1.15'); break;

    case 'toolSwap':
      p = procById('BOND'); p.toolUsage = 0; p.machine.down = 14;   // 换劈刀 14 游戏秒
      G.money -= COST.toolCost; G.paf.P += COST.toolCost;
      if (p.chart) p.chart.resetBaseline();
      logMsg('sys', '已换劈刀：磨损归零'); break;
    case 'toolComp':
      p = procById('BOND'); p.pv.usPower = clamp(p.pv.usPower + 12, 70, 165);
      p.machine.sigmaK = (p.machine.sigmaK || 1) * 1.35;
      logMsg('sys', '超声功率 +12mW 补偿，σ 变大'); break;
    case 'toolIgnore':
      p = procById('BOND'); p.toolUsage += 12000;
      logMsg('warn', '继续用劈刀：磨损跳升，拉力持续下滑'); break;
  }
  if (G.freeze > 0) {
    for (var i = 0; i < G.procs.length; i++) {
      if (G.procs[i].machine.down < G.freeze) G.procs[i].machine.down = G.freeze;
    }
    G.freeze = 0;
  }
}

/* ---------- 计划保养 / 手动动作 ---------- */
function doPM(pi) {
  var p = G.procs[pi];
  if (p.machine.down > 0) return false;
  p.machine.health = 1; p.machine.drift = 0; p.machine.lastPM = G.t;
  p.machine.down = COST.pmDown * TSCALE * 10;
  G.money -= COST.maintCost; G.paf.P += COST.maintCost;
  if (p.chart) p.chart.resetBaseline();
  logMsg('sys', '🔧 ' + p.d.short + ' 计划保养完成（−' + money(COST.maintCost) + '，控制限需重建）');
  return true;
}
function doToolSwap() {
  var p = procById('BOND');
  if (!p || p.machine.down > 0) return false;
  p.toolUsage = 0; p.machine.down = 14;   // 换劈刀 14 游戏秒
  G.money -= COST.toolCost; G.paf.P += COST.toolCost;
  if (p.chart) p.chart.resetBaseline();
  logMsg('sys', '🔪 已更换劈刀（−' + money(COST.toolCost) + '）');
  return true;
}
function toggleDryer() {
  G.dryer = !G.dryer;
  logMsg('sys', G.dryer ? '💨 干燥柜开启' : '干燥柜关闭');
  return G.dryer;
}
function buyTech(id) {
  var t = null;
  for (var i = 0; i < TECHS.length; i++) if (TECHS[i].id === id) t = TECHS[i];
  if (!t || G.techs[id]) return { ok: false, why: '已拥有' };
  if (t.need && !G.techs[t.need]) return { ok: false, why: '需先解锁前置' };
  if (G.money < t.cost) return { ok: false, why: '资金不足' };
  G.money -= t.cost; G.techs[id] = true;
  /* 科技是资本支出：现金一次性扣掉，但不能整笔砸进本关的预防成本，
     否则「买设备」这个长期正确的决策会在买入当关把利润打穿。
     这里只计一次性导入费用（安装调试 + PPAP 重新认证），
     设备折旧在 finish() 里按本关产量摊销。 */
  G.paf.P += t.cost * 0.004;
  if (t.br === '效率') for (var k = 0; k < G.procs.length; k++) G.procs[k].buf = BUF_DEFAULT + (techOn('ef_conveyor') ? 6 : 0);
  logMsg('sys', '⚙ 已购置「' + t.name + '」（−' + money(t.cost) + '）');
  return { ok: true };
}
function setBom(matId, grade) {
  if (G.lockedBom.indexOf(matId) >= 0) return false;
  if (BOM_ORDER.indexOf(grade) < 0) return false;
  G.bom[matId] = grade;
  return true;
}

/* ---------- PAF 四维结算 ---------- */
function levelCpk() {
  var out = [], ok = true;
  for (var i = 0; i < G.lv.cpkOn.length; i++) {
    var p = procById(G.lv.cpkOn[i]);
    if (!p || !p.chart) continue;
    var c = p.chart.cpk();
    var v = c ? c.cpk : null;
    if (v === null || v < G.lv.cpk) ok = false;
    out.push({ id: p.d.id, name: p.d.short, cpk: v, need: G.lv.cpk, pass: (v !== null && v >= G.lv.cpk) });
  }
  return { list: out, pass: ok };
}

function finish(complete) {
  if (G.over) return;
  G.over = true; G.running = false;
  var lv = G.lv, pr = PRICE[lv.grade];

  /* --- 交付与逾期 --- */
  var lateMin = Math.max(0, (G.t - lv.timeLimit) / 60);
  var deliverRate = G.shipped / lv.qty;

  /* --- 收入 --- */
  var goodUnits = G.shipped - G.downgraded - G.escaped;
  var revenue = Math.max(0, goodUnits) * pr.unit
              + G.downgraded * pr.unit * pr.downgrade
              + G.escaped * pr.unit;                       // 逃逸件也收了钱，但索赔在 EF
  revenue *= (1 + G.revBonus);
  var latePenalty = revenue * COST.latePenaltyK * lateMin;
  revenue -= latePenalty;

  /* --- PAF --- */
  var paf = G.paf;
  /* 已购设备的折旧按本关产量摊销进预防成本：
     ¥100 万的设备、8 年寿命、年产 18 万只 → ≈ ¥0.7/只。
     这里用 0.0045×产量/100 近似，保证「科技不是白送的」但也不会一关吃掉利润。 */
  var techCapital = 0;
  for (var ti = 0; ti < TECHS.length; ti++) if (G.techs[TECHS[ti].id]) techCapital += TECHS[ti].cost;
  var depreciation = techCapital * 0.0025 * (lv.qty / 100);
  paf.P += depreciation;

  var TQC = paf.P + paf.A + paf.IF + paf.EF;
  var appraisalRatio = TQC > 0 ? paf.A / TQC : 0;
  /* 收工时还在线上的在制品是存货资产，不是本期成本（只按 5% 计跌价）。
     不做这一步的话，18 工位流水线的管道存量会被全额费用化，
     单件成本凭空多出十几个点，成本维与收益维会恒为 0。 */
  var wipUnits = wipCount();
  var wipValue = wipUnits * bomUnitCost() * 0.95;
  var matExpensed = Math.max(0, G.matCost - wipValue);
  var totalCost = matExpensed + G.laborCost + TQC;
  var unitCost = totalCost / Math.max(1, G.shipped);
  var profit = revenue - totalCost;
  var gm = revenue > 0 ? profit / revenue : -1;

  /* --- CPK --- */
  var cpkRes = levelCpk();

  /* --- 逃逸红线 --- */
  var escRate = G.shipped > 0 ? G.escaped / G.shipped : 0;
  var escBreach = escRate > lv.escLimit;

  /* --- 四维评分 --- */
  // 质量 0.35：CPK 达成 + 逃逸控制 + 一次通过率
  var cpkScore = 0;
  if (cpkRes.list.length) {
    var s = 0;
    for (var i = 0; i < cpkRes.list.length; i++) {
      var c = cpkRes.list[i];
      s += c.cpk === null ? 0 : clamp(c.cpk / c.need, 0, 1.25) / 1.25;
    }
    cpkScore = s / cpkRes.list.length;
  }
  var escScore = clamp(1 - escRate / Math.max(1e-6, lv.escLimit), 0, 1);
  var fpy = G.released > 0 ? (G.shipped - G.downgraded) / G.released : 0;
  var fpyScore = clamp((fpy - 0.45) / 0.45, 0, 1);
  var qScore = 0.45 * cpkScore + 0.35 * escScore + 0.20 * fpyScore;

  // 成本 0.25：单件成本 vs 目标
  var cScore = clamp(1 - (unitCost - lv.targetCost) / (lv.targetCost * 0.22), 0, 1.15) / 1.15;

  // 效率 0.20：交付率 + 时间利用 + 停机
  /* 时间利用率是有梯度的：只罚超时会让「慢慢做」和「压节拍做」同分，
     取舍就消失了。这里 60% 时限内交完拿满分，用满时限只有 0.55，
     超时按 25% 时限线性归零 —— 全检吃掉的 22% 节拍会真实反映在这一项上。 */
  var useRatio = G.t / Math.max(1, lv.timeLimit);
  var timeScore = useRatio <= 0.45 ? 1
    : useRatio <= 1.0 ? clamp(1 - (useRatio - 0.45) / 0.55 * 0.55, 0, 1)
    : clamp(0.45 - (useRatio - 1.0) / 0.25 * 0.45, 0, 1);
  var downCount = 0;
  for (var j = 0; j < G.procs.length; j++) downCount += G.procs[j].machine.downCount;
  var downScore = clamp(1 - downCount / 6, 0, 1);
  var eScore = 0.40 * clamp(deliverRate, 0, 1) + 0.42 * timeScore + 0.18 * downScore;

  // 收益 0.20：毛利率 vs 目标
  var rScore = clamp((gm + 0.05) / (lv.targetGM + 0.05), 0, 1.2) / 1.2;

  var score = 100 * (0.35 * qScore + 0.25 * cScore + 0.20 * eScore + 0.20 * rScore);

  var pass = complete && cpkRes.pass && !escBreach && deliverRate >= 0.98 && profit > 0;
  var reasons = [];
  if (!complete) reasons.push('未在时限内完成订单（' + G.shipped + '/' + lv.qty + '）');
  if (!cpkRes.pass) reasons.push('关键特性 CPK 未达 ' + lv.cpk.toFixed(2));
  if (escBreach) reasons.push('逃逸率 ' + (escRate * 100).toFixed(2) + '% 突破红线 ' + (lv.escLimit * 100).toFixed(1) + '%');
  if (profit <= 0) reasons.push('本关亏损 ' + money(profit));

  if (escBreach) { score *= 0.55; G.rep = clamp(G.rep - 18, 0, 100); }
  if (pass) G.rep = clamp(G.rep + 6, 0, 100);

  G.money += profit;

  /* --- PAF U 型曲线采样（供 UI 绘制玩家落点）--- */
  var curve = [];
  for (var a = 0.02; a <= 0.72; a += 0.02) {
    /* 经验模型：鉴定成本↑ → 失效成本按指数下降，总成本呈 U 型
       系数由本关实际 IF+EF 在实际鉴定占比处标定，保证玩家落点落在自己的曲线上 */
    var base = TQC > 0 ? TQC : 1;
    var failAt = (paf.IF + paf.EF) * Math.exp(-(a - appraisalRatio) * 4.2);
    var apprAt = base * a;
    curve.push({ a: a, total: (apprAt + failAt + paf.P) / Math.max(1, G.shipped) });
  }

  G.result = {
    pass: pass, complete: complete, score: score, reasons: reasons,
    shipped: G.shipped, qty: lv.qty, deliverRate: deliverRate,
    scrapped: G.scrapped, reworked: G.reworked, escaped: G.escaped,
    downgraded: G.downgraded, rejected: G.rejectedLots,
    overkill: G.overkill, missed: G.missed, released: G.released,
    escRate: escRate, escLimit: lv.escLimit, escBreach: escBreach,
    cpk: cpkRes.list, cpkPass: cpkRes.pass,
    revenue: revenue, latePenalty: latePenalty,
    matCost: matExpensed, laborCost: G.laborCost,
    wipUnits: wipUnits, wipValue: wipValue,
    paf: { P: paf.P, A: paf.A, IF: paf.IF, EF: paf.EF }, TQC: TQC,
    appraisalRatio: appraisalRatio, healthy: (appraisalRatio >= 0.20 && appraisalRatio <= 0.35),
    totalCost: totalCost, unitCost: unitCost, targetCost: lv.targetCost,
    profit: profit, gm: gm, targetGM: lv.targetGM,
    dims: { q: qScore, c: cScore, e: eScore, r: rScore },
    fpy: fpy, rep: G.rep, money: G.money, t: G.t, timeLimit: lv.timeLimit,
    curve: curve, defectTally: G.defectTally,
    techs: JSON.parse(JSON.stringify(G.techs)),
    bom: JSON.parse(JSON.stringify(G.bom))
  };

  logMsg(pass ? 'good' : 'bad', (pass ? '✔ 关卡通过' : '✖ 关卡未通过') + ' · 得分 ' + score.toFixed(1));
  saveScore(lv.id, score, pass);
  if (pass) saveProgress(G.lvIdx + 1, G.money, G.rep, G.techs);
  return G.result;
}

/* ---------- 存档 ---------- */
function lsGet(k, def) {
  try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; }
}
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }

function loadScores() { return lsGet(LS_SCORE, {}); }
function saveScore(lvId, score, pass) {
  var s = loadScores();
  var cur = s[lvId];
  if (!cur || score > cur.score) s[lvId] = { score: score, pass: pass, t: Date.now() };
  else if (pass && !cur.pass) s[lvId].pass = true;
  lsSet(LS_SCORE, s);
}
function loadProgress() {
  return lsGet(LS_PROG, { unlocked: 0, money: 260000, rep: 70, techs: {} });
}
function saveProgress(unlockedIdx, money, rep, techs) {
  var p = loadProgress();
  p.unlocked = Math.max(p.unlocked, Math.min(unlockedIdx, LEVELS.length - 1));
  p.money = money; p.rep = rep; p.techs = techs;
  lsSet(LS_PROG, p);
}
function resetProgress() {
  try { localStorage.removeItem(LS_PROG); localStorage.removeItem(LS_SCORE); localStorage.removeItem(LS_SAVE); } catch (e) { }
}

/* 关内快照存读（暂停时可存，重开可读） */
function saveSnapshot() {
  if (!G) return false;
  var snap = {
    lvIdx: G.lvIdx, t: G.t, money: G.money, rep: G.rep,
    techs: G.techs, bom: G.bom,
    released: G.released, shipped: G.shipped, scrapped: G.scrapped,
    reworked: G.reworked, escaped: G.escaped, downgraded: G.downgraded,
    rejectedLots: G.rejectedLots, overkill: G.overkill, missed: G.missed,
    matCost: G.matCost, laborCost: G.laborCost, paf: G.paf,
    humidity: G.humidity, dryer: G.dryer, moistureH: G.moistureH,
    grrPenalty: G.grrPenalty, tm1Shift: G.tm1Shift, claimK: G.claimK,
    revBonus: G.revBonus, overtime: G.overtime, evtDone: G.evtDone,
    seq: G.seq, defectTally: G.defectTally,
    procs: G.procs.map(function (p) {
      return {
        pv: p.pv, thr: p.thr, cov: p.cov, sampling: p.sampling,
        toolUsage: p.toolUsage, machine: p.machine,
        cnt: p.cnt, scrap: p.scrap, rework: p.rework, ok: p.ok,
        overkill: p.overkill, missed: p.missed, inspected: p.inspected,
        viols: p.viols, lastVal: p.lastVal,
        chart: p.chart ? { allValues: p.chart.allValues.slice(-200), pts: p.chart.pts.slice(-60), rs: p.chart.rs.slice(-60) } : null
      };
    })
  };
  lsSet(LS_SAVE, snap);
  return true;
}
function hasSnapshot() { return !!lsGet(LS_SAVE, null); }
function loadSnapshot() {
  var s = lsGet(LS_SAVE, null);
  if (!s) return false;
  newGame(s.lvIdx, { money: s.money, rep: s.rep, techs: s.techs });
  G.t = s.t; G.bom = s.bom;
  G.released = s.released; G.shipped = s.shipped; G.scrapped = s.scrapped;
  G.reworked = s.reworked; G.escaped = s.escaped; G.downgraded = s.downgraded;
  G.rejectedLots = s.rejectedLots; G.overkill = s.overkill; G.missed = s.missed;
  G.matCost = s.matCost; G.laborCost = s.laborCost; G.paf = s.paf;
  G.humidity = s.humidity; G.dryer = s.dryer; G.moistureH = s.moistureH;
  G.grrPenalty = s.grrPenalty; G.tm1Shift = s.tm1Shift; G.claimK = s.claimK;
  G.revBonus = s.revBonus; G.overtime = s.overtime; G.evtDone = s.evtDone || {};
  G.seq = s.seq; G.defectTally = s.defectTally || {};
  for (var i = 0; i < G.procs.length && i < s.procs.length; i++) {
    var p = G.procs[i], q = s.procs[i];
    p.pv = q.pv; p.thr = q.thr; p.cov = q.cov; p.sampling = q.sampling;
    p.toolUsage = q.toolUsage; p.machine = q.machine;
    p.cnt = q.cnt; p.scrap = q.scrap; p.rework = q.rework; p.ok = q.ok;
    p.overkill = q.overkill; p.missed = q.missed; p.inspected = q.inspected;
    p.viols = q.viols; p.lastVal = q.lastVal;
    if (p.chart && q.chart) {
      p.chart.allValues = q.chart.allValues || [];
      for (var v = 0; v < (q.chart.pts || []).length; v++) {
        p.chart.pts.push(q.chart.pts[v]); p.chart.rs.push(q.chart.rs[v]);
        p.chart.subgroups.push({ xbar: q.chart.pts[v], r: q.chart.rs[v], idx: v, viol: [] });
      }
      p.chart.baselineHave = p.chart.pts.length;
      if (p.chart.baselineHave >= p.chart.baselineNeed) p.chart.computeLimits();
    }
  }
  logMsg('sys', '已读取存档：' + G.lv.name + ' · 已出货 ' + G.shipped + '/' + G.lv.qty);
  return true;
}
function clearSnapshot() { try { localStorage.removeItem(LS_SAVE); } catch (e) { } }

  // ---------------------------------------------------------------------
  // 运行时状态
  // ---------------------------------------------------------------------
  var ctx = null, master = null, musicGain = null, sfxGain = null;
  var muted = false, started = false, schedulerTimer = null;
  var theme = null, baseTheme = null, level = 1, step = 0, nextNoteTime = 0;

  // 若主题声明了 levels[]，则每关直接换一套编配（调式/速度/动机/鼓型/层次）；
  // 否则退回旧行为：统一动机 + 每关移调 2 半音 / 提速 5BPM。
  function applyLevelTheme() {
    if (!baseTheme) return;
    if (baseTheme.levels && baseTheme.levels.length) {
      var v = baseTheme.levels[Math.min(level, baseTheme.levels.length) - 1] || {};
      var merged = {}, k;
      for (k in baseTheme) if (baseTheme.hasOwnProperty(k) && k !== 'levels') merged[k] = baseTheme[k];
      for (k in v) if (v.hasOwnProperty(k)) merged[k] = v[k];
      merged.perLevel = true;
      theme = merged;
    } else {
      theme = baseTheme;
    }
  }

  function ensureCtx() {
    if (ctx) return true;
    try {
      var AC = global.AudioContext || global.webkitAudioContext;
      if (!AC) return false;
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicGain = ctx.createGain(); musicGain.gain.value = muted ? 0 : 0.42; musicGain.connect(master);
      sfxGain = ctx.createGain(); sfxGain.gain.value = muted ? 0 : 0.95; sfxGain.connect(master);
      return true;
    } catch (e) { return false; }
  }

  function freqOf(scaleArr, deg, octave, transposeSemis) {
    var n = scaleArr.length;
    var oct = Math.floor(deg / n) + (octave || 0);
    var semi = scaleArr[((deg % n) + n) % n] + 12 * oct + (transposeSemis || 0);
    return theme.root * Math.pow(2, semi / 12);
  }

  // ---------------------------------------------------------------------
  // 鼓 / 打击乐（纯噪声 + 短振荡，零素材）
  // ---------------------------------------------------------------------
  function noiseBurst(dur, vol, cutoff, t) {
    if (!ctx) return;
    t = t || ctx.currentTime;
    var len = Math.max(1, Math.floor(ctx.sampleRate * dur));
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    var src = ctx.createBufferSource(); src.buffer = buf;
    var f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
    var g = ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(musicGain);
    src.start(t); src.stop(t + dur + 0.02);
  }
  function kick(t, gain) {
    if (!ctx) return;
    var o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.14);
    var g = ctx.createGain(); g.gain.setValueAtTime(gain || 0.5, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    o.connect(g).connect(musicGain); o.start(t); o.stop(t + 0.2);
  }
  function hat(t, vol) {
    noiseBurst(0.04, vol || 0.12, 7000, t);
  }
  function snare(t) {
    noiseBurst(0.12, 0.22, 2600, t);
    var o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.setValueAtTime(190, t);
    var g = ctx.createGain(); g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    o.connect(g).connect(musicGain); o.start(t); o.stop(t + 0.14);
  }
  // 木鱼 / 梆子 —— 庙会摊位的「哒」，卡通追逐的骨架
  function woodblock(t, vol, pitch) {
    if (!ctx) return;
    pitch = pitch || 1200; vol = vol || 0.18;
    var o = ctx.createOscillator(); o.type = 'square';
    o.frequency.setValueAtTime(pitch, t);
    o.frequency.exponentialRampToValueAtTime(pitch * 0.55, t + 0.045);
    var bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = pitch; bp.Q.value = 5;
    var g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    o.connect(bp).connect(g).connect(musicGain); o.start(t); o.stop(t + 0.08);
    noiseBurst(0.018, vol * 0.45, 5200, t);
  }
  // 牛铃 —— 马戏团 oom-pah 的滑稽点缀
  function cowbell(t, vol) {
    if (!ctx) return;
    vol = vol || 0.1;
    [540, 800].forEach(function (f) {
      var o = ctx.createOscillator(); o.type = 'square'; o.frequency.value = f;
      var bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2600; bp.Q.value = 2;
      var g = ctx.createGain();
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
      o.connect(bp).connect(g).connect(musicGain); o.start(t); o.stop(t + 0.16);
    });
  }
  // 锣 —— 庙会开场／终局压场
  function gong(t, vol) {
    if (!ctx) return;
    vol = vol || 0.22;
    noiseBurst(0.7, vol * 0.8, 2200, t);
    [98, 147, 233].forEach(function (f, i) {
      var o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = f * (1 + i * 0.004);
      var g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol * 0.6, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
      o.connect(g).connect(musicGain); o.start(t); o.stop(t + 1.2);
    });
  }
  function drums(style, s, t) {
    switch (style) {
      case 'drive':
        if (s % 4 === 0) kick(t, 0.55); if (s % 4 === 2) snare(t); if (s % 2 === 0) hat(t, 0.08); break;
      case 'bouncy':
        if (s === 0 || s === 8) kick(t, 0.5); if (s % 2 === 1) hat(t, 0.1); if (s === 4 || s === 12) kick(t, 0.3); break;
      case 'march':
        if (s % 8 === 0 || s % 8 === 4) kick(t, 0.5); if (s % 8 === 4 || s % 8 === 12) snare(t); if (s % 2 === 0) hat(t, 0.1); break;
      case 'waltz':
        if (s === 0 || s === 5 || s === 10) kick(t, 0.5); if (s === 2 || s === 7 || s === 12) hat(t, 0.12); if (s === 5 || s === 10) snare(t); break;
      case 'frenzy':
        if (s % 4 === 0) kick(t, 0.5); if (s % 4 === 2) kick(t, 0.3); if (s % 2 === 0) hat(t, 0.12); if (s % 8 === 6) snare(t); break;
      case 'busy':
        if (s % 4 === 0) kick(t, 0.45); if (s % 2 === 0) hat(t, 0.1); if (s % 8 === 4) snare(t); break;
      case 'staccato':
        if (s % 2 === 0) kick(t, 0.4); if (s % 4 === 2) hat(t, 0.14); if (s % 8 === 6) snare(t); break;
      // ---- 打地鼠专用鼓型（逐关递进）----
      case 'sneak':      // 潜行：几乎只有脚步和反拍木鱼，留白最多
        if (s % 8 === 0) kick(t, 0.42);
        if (s === 6 || s === 14) woodblock(t, 0.15, 1500);
        if (s % 4 === 2) hat(t, 0.06);
        break;
      case 'whack':      // 敲击：正拍落锤 + 2/4 拍木鱼，动作感明确
        if (s % 4 === 0) kick(t, 0.5);
        if (s === 4 || s === 12) { snare(t); woodblock(t, 0.18, 1100); }
        if (s % 2 === 0) hat(t, 0.09);
        break;
      case 'clockwork':  // 秒表：匀速木鱼滴答，强调「按顺序执行」
        if (s % 4 === 0) kick(t, 0.44);
        if (s % 2 === 0) woodblock(t, s % 4 === 0 ? 0.17 : 0.1, s % 8 === 0 ? 1400 : 980);
        if (s === 8) snare(t);
        break;
      case 'oompah':     // 马戏团：oom-pah 摇摆 + 牛铃，明快但不可信
        if (s % 8 === 0) kick(t, 0.55);
        if (s % 8 === 4) { snare(t); hat(t, 0.12); }
        if (s % 4 === 2) cowbell(t, 0.09);
        break;
      case 'stampede':   // 暴走：八分连踩 + 每小节开锣
        if (s % 2 === 0) kick(t, s % 4 === 0 ? 0.55 : 0.3);
        hat(t, s % 2 === 1 ? 0.13 : 0.06);
        if (s % 8 === 6) snare(t);
        if (s === 0) woodblock(t, 0.2, 900);
        break;
      default: if (s % 4 === 0) kick(t, 0.5);
    }
  }

  // ---------------------------------------------------------------------
  // 音符（带包络）
  // ---------------------------------------------------------------------
  function tone(freq, type, t, dur, vol, dest) {
    if (!ctx) return;
    var o = ctx.createOscillator(); o.type = type; o.frequency.value = freq;
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(dest || musicGain);
    o.start(t); o.stop(t + dur + 0.02);
  }

  // ---------------------------------------------------------------------
  // 调度器（前瞻 0.12s）
  // ---------------------------------------------------------------------
  function stepDur() {
    var bpm = theme.bpm + (theme.perLevel ? 0 : (level - 1) * 5);
    return 60 / bpm / 4;
  }
  function scheduler() {
    if (!ctx || !theme) return;
    while (nextNoteTime < ctx.currentTime + 0.12) {
      scheduleStep(step, nextNoteTime);
      nextNoteTime += stepDur();
      step = (step + 1) % 16;
    }
  }
  function scheduleStep(s, t) {
    var sc = SCALES[theme.scale];
    // perLevel 主题：移调由该关编配指定；否则沿用「每关 +2 半音」
    var trans = theme.perLevel ? (theme.transpose || 0) : (level - 1) * 2;
    var padOn = theme.perLevel ? !!theme.pad : (level >= 2);
    var counterOn = theme.perLevel ? !!theme.counter : (level >= 3);
    // 低音（bassDur 控制断奏/连奏 —— 潜行关是短促的脚步，暴走关几乎不留缝）
    if (s % 4 === 0) {
      var bi = (s / 4) % theme.bassPat.length;
      tone(freqOf(sc, theme.bassPat[bi], -1, trans), theme.bass, t, stepDur() * (theme.bassDur || 3.4), 0.5);
    }
    // 主旋律（动机）
    var deg = theme.motif[s];
    if (deg !== null && deg !== undefined) {
      tone(freqOf(sc, deg, 0, trans), theme.lead, t, stepDur() * 1.8, 0.3);
    }
    // 铺底和声（根+三+五，长音）
    if (padOn && s === 0) {
      [0, 2, 4].forEach(function (d) { tone(freqOf(sc, d, -1, trans), 'sine', t, stepDur() * 14, 0.12); });
    }
    // 高八度反旋律（在反拍）
    if (counterOn && s % 2 === 1) {
      tone(freqOf(sc, theme.motif[(s + 2) % 16] != null ? theme.motif[(s + 2) % 16] : 0, 1, trans), 'triangle', t, stepDur() * 1.2, 0.14);
    }
    // 终关：高音十六分琶音 —— 制造「压不住的扩散感」
    if (theme.arp) {
      tone(freqOf(sc, [0, 2, 4, 3][s % 4] + (s >= 8 ? 1 : 0), 1, trans), 'square', t, stepDur() * 0.7, 0.075);
    }
    // 终关：每小节开锣
    if (theme.gong && s === 0) gong(t, 0.2);
    // 鼓
    drums(theme.drum, s, t);
  }

  // ---------------------------------------------------------------------
  // 对外：BGM 控制
  // ---------------------------------------------------------------------
  function start() {
    if (!ensureCtx()) return;
    if (ctx.state === 'suspended') ctx.resume();
    if (started || !theme) return;
    started = true; step = 0; nextNoteTime = ctx.currentTime + 0.08;
    schedulerTimer = setInterval(scheduler, 25);
  }
  function stop() {
    started = false;
    if (schedulerTimer) { clearInterval(schedulerTimer); schedulerTimer = null; }
  }

  // ---------------------------------------------------------------------
  // 对外：得分 / 失误 / 过关 / 结算（设计核心 —— 二者截然相反）
  // ---------------------------------------------------------------------
  function score(tier) {
    if (!ensureCtx()) return;
    if (ctx.state === 'suspended') ctx.resume();
    tier = Math.max(0, Math.min(6, tier || 0));
    var t = ctx.currentTime;
    var base = 880 * Math.pow(2, tier / 12);     // 连击越高，基础音越高
    [0, 4, 7, 12].forEach(function (semi, i) {   // 大三和弦上行琶音 —— 明亮、肯定
      var f = base * Math.pow(2, semi / 12);
      var o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
      var g = ctx.createGain();
      var tt = t + i * 0.05;
      g.gain.setValueAtTime(0.0001, tt);
      g.gain.exponentialRampToValueAtTime(0.26, tt + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, tt + 0.26);
      o.connect(g).connect(sfxGain); o.start(tt); o.stop(tt + 0.3);
    });
    // 高频泛音“叮”—— 辨识度极高的奖励音
    var sp = ctx.createOscillator(); sp.type = 'sine'; sp.frequency.value = base * 4;
    var sg = ctx.createGain(); sg.gain.setValueAtTime(0.14, t + 0.2); sg.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
    sp.connect(sg).connect(sfxGain); sp.start(t + 0.2); sp.stop(t + 0.36);
  }

  function error() {
    if (!ensureCtx()) return;
    if (ctx.state === 'suspended') ctx.resume();
    var t = ctx.currentTime;
    [0, -1, -3].forEach(function (semi) {        // 小二度 + 小三度簇 —— 暗淡、刺耳、否定
      var f = 200 * Math.pow(2, semi / 12);
      var o = ctx.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 0.82, t + 0.26);
      var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 600; // 闷住高频
      var g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.24, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
      o.connect(lp).connect(g).connect(sfxGain); o.start(t); o.stop(t + 0.34);
    });
    noiseBurst(0.18, 0.3, 300, t);                // 低频闷击 —— 与得分的“叮”彻底相反
  }

  function levelUp() {
    if (!ensureCtx()) return;
    var t = ctx.currentTime, base = 523.25;
    [0, 4, 7, 12].forEach(function (semi, i) {
      toneAt(base * Math.pow(2, semi / 12), 'triangle', t + i * 0.07, 0.22, 0.28, sfxGain);
    });
  }
  function toneAt(freq, type, t, dur, vol, dest) {
    if (!ctx) return;
    var o = ctx.createOscillator(); o.type = type; o.frequency.value = freq;
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(dest || sfxGain); o.start(t); o.stop(t + dur + 0.02);
  }

  function gameOver(win) {
    if (!ensureCtx()) return;
    var t = ctx.currentTime, base = win ? 523.25 : 392.0;
    var seq = win ? [0, 4, 7, 12, 16] : [0, -2, -5, -9];
    seq.forEach(function (semi, i) {
      toneAt(base * Math.pow(2, semi / 12), win ? 'triangle' : 'sawtooth', t + i * 0.12, 0.4, 0.26, sfxGain);
    });
  }

  // ---------------------------------------------------------------------
  // 静音按钮
  // ---------------------------------------------------------------------
  function buildMuteButton() {
    if (document.getElementById('qa-mute-btn')) return;
    var b = document.createElement('button');
    b.id = 'qa-mute-btn';
    b.textContent = muted ? '🔇' : '🔊';

/* ============================================================
   产线 Canvas —— 18 工位蛇形两行
   ============================================================ */
var LINE_GEO = [];     // [{x,y,w,h,i,row,col}]
var LINE_ROWS = [];    // [{a,b,even,startIdx,endIdx,leftX,rightX,y}]
var LINE_perRow = 1, LINE_rows = 1, LINE_chh = 74;

/* N 行蛇形布局：卡片尺寸随屏宽自适应。
   策略：行数优先取「高度预算允许的最大值」→ 卡片在每行内尽量大；
   仅在极窄屏（宽度要求的最小列数超出高度能装下的行数）时才缩小卡片。 */
function layoutLine(W, H) {
  LINE_GEO = []; LINE_ROWS = [];
  var n = PROC_DEFS.length;
  var padX = 14, padY = 10, gapX = 8, gapY = 7, beltOff = 11;
  var minCw, chh;
  if (W < 700) { minCw = 62; chh = 58; }
  else         { minCw = 84; chh = 74; }
  LINE_chh = chh;

  function rowBudget(h) { return Math.max(1, Math.floor((H - padY * 2 + gapY + beltOff) / (h + gapY + beltOff))); }

  var rows = rowBudget(chh);
  var perRowByWVal = Math.max(1, Math.floor((W - padX * 2 + gapX) / (minCw + gapX)));
  var minRowsForW = Math.ceil(n / perRowByWVal);
  /* 宽度要求更多行而高度装不下 → 缩小卡片直到高度能容纳 */
  while (rows < minRowsForW && chh > 34) {
    chh -= 4; rows = rowBudget(chh);
  }
  LINE_chh = chh;

  var perRow = Math.ceil(n / rows);
  LINE_perRow = perRow; LINE_rows = rows;

  var cw = (W - padX * 2 - gapX * (perRow - 1)) / perRow;
  var rowY = [];
  for (var r = 0; r < rows; r++) rowY.push(padY + r * (chh + gapY + beltOff));

  for (var i = 0; i < n; i++) {
    var row = Math.floor(i / perRow);
    var pos = i % perRow;
    var col = (row % 2 === 0) ? pos : (perRow - 1 - pos);  /* 蛇形：偶行 →，奇行 ← */
    LINE_GEO.push({
      i: i, row: row, col: col,
      x: padX + col * (cw + gapX), y: rowY[row], w: cw, h: chh
    });
  }
  /* 行元数据：视觉起点/终点工位、左右边界、y 坐标 */
  for (var r2 = 0; r2 < rows; r2++) {
    var a = r2 * perRow, b = Math.min((r2 + 1) * perRow, n) - 1;
    var even = (r2 % 2 === 0);
    var gA = LINE_GEO[a], gB = LINE_GEO[b];
    LINE_ROWS.push({
      a: a, b: b, even: even,
      startIdx: even ? a : b, endIdx: even ? b : a,
      leftX: Math.min(gA.x, gB.x), rightX: Math.max(gA.x + gA.w, gB.x + gB.w),
      y: rowY[r2]
    });
  }
}

function drawLine() {
  var cv = $('lineCv');
  if (!cv || !G) return;
  var dpr = window.devicePixelRatio || 1;
  var W = cv.clientWidth, H = cv.clientHeight;
  if (!W || !H) return;
  if (W < 60 || H < 40) return;   /* 画布尚未布局/被隐藏时跳过，避免退化几何 */
  if (cv.width !== W * dpr || cv.height !== H * dpr) {
    cv.width = W * dpr; cv.height = H * dpr;
  }
  var c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, W, H);

  layoutLine(W, H);
  var bi = bottleneckIdx();
  var beltOff = 12;

  /* ---- 传送带（每行一条 + 行间 U 弯，N 行蛇形） ---- */
  c.save();
  c.strokeStyle = '#cddef2'; c.lineWidth = 5; c.lineCap = 'round';
  for (var r = 0; r < LINE_ROWS.length; r++) {
    var R = LINE_ROWS[r];
    var y = R.y + LINE_chh + beltOff;
    var xa = R.leftX, xb = R.rightX;
    c.beginPath(); c.moveTo(xa, y); c.lineTo(xb, y); c.stroke();
    /* 流动小点：方向随行反转（蛇形） */
    c.fillStyle = 'rgba(30,136,255,.55)';
    var dir = R.even ? 1 : -1;
    var span = (xb - xa) || 1;
    for (var d2 = 0; d2 < 46; d2++) {
      var t = ((d2 * 24 + UI.flow * dir * 44) % span + span) % span;
      c.beginPath(); c.arc(xa + t, y, 1.8, 0, 6.2832); c.fill();
    }
    /* 行间 U 弯：偶行在右、奇行在左交替 */
    if (r + 1 < LINE_ROWS.length) {
      var Rn = LINE_ROWS[r + 1];
      var y2 = Rn.y + LINE_chh + beltOff;
      var side = R.even ? 'right' : 'left';
      var endX = side === 'right' ? R.rightX : R.leftX;
      var startX = side === 'right' ? Rn.rightX : Rn.leftX;
      var xBend = side === 'right' ? R.rightX + 7 : R.leftX - 7;
      c.beginPath();
      c.moveTo(endX, y);
      c.lineTo(xBend, y);
      c.lineTo(xBend, y2);
      c.lineTo(startX, y2);
      c.stroke();
    }
  }
  c.restore();

  /* ---- 工位 ---- */
  for (var i = 0; i < LINE_GEO.length; i++) {
    var g = LINE_GEO[i], p = G.procs[i], d = p.d;
    var isGate = d.kind === 'gate';
    var down = p.machine.down > 0;
    var sel = i === UI.sel, hov = i === UI.hover;

    /* 底板 */
    c.beginPath();
    roundRect(c, g.x, g.y, g.w, g.h, 9);
    var grd = c.createLinearGradient(0, g.y, 0, g.y + g.h);
    if (down) { grd.addColorStop(0, '#ffecec'); grd.addColorStop(1, '#ffdcdc'); }
    else if (isGate) { grd.addColorStop(0, '#fffaf0'); grd.addColorStop(1, '#fff3dc'); }
    else { grd.addColorStop(0, '#ffffff'); grd.addColorStop(1, '#f0f6fd'); }
    c.fillStyle = grd; c.fill();
    c.strokeStyle = sel ? '#1e88ff' : hov ? '#7cb6f2' : (isGate ? '#f0d9a8' : '#d5e2f2');
    c.lineWidth = sel ? 2 : 1; c.stroke();

    if (i === bi) {  /* 瓶颈标记 */
      c.strokeStyle = 'rgba(245,158,11,.85)'; c.lineWidth = 2;
      c.setLineDash([4, 3]);
      roundRect(c, g.x - 2.5, g.y - 2.5, g.w + 5, g.h + 5, 11); c.stroke();
      c.setLineDash([]);
    }

    /* 图标 + 名称（按卡片高度等比定位，兼容 56/74px 两种卡片） */
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.font = Math.max(11, Math.round(g.h * 0.22)) + 'px system-ui';
    c.fillText(d.icon, g.x + g.w / 2, g.y + g.h * 0.22);
    c.font = '700 9.5px "PingFang SC","Microsoft YaHei",system-ui';
    c.fillStyle = '#12233b';
    c.fillText(clipTxt(c, d.short, g.w - 6), g.x + g.w / 2, g.y + g.h * 0.40);

    /* 队列格子 */
    var qn = p.queue.length, cap = p.buf;
    var bw = Math.max(2, g.w - 12), bx = g.x + 6, by = g.y + g.h * 0.52;
    c.fillStyle = '#e6eef8';
    roundRect(c, bx, by, bw, 5, 2.5); c.fill();
    if (cap > 0) {
      var fw = bw * clamp(qn / cap, 0, 1);
      c.fillStyle = qn >= cap ? '#ef4444' : qn > cap * 0.6 ? '#f59e0b' : '#1e88ff';
      roundRect(c, bx, by, Math.max(fw, qn > 0 ? 3 : 0), 5, 2.5); c.fill();
    }

    /* 加工进度 */
    var by2 = g.y + g.h * 0.66;
    c.fillStyle = '#e6eef8';
    roundRect(c, bx, by2, bw, 5, 2.5); c.fill();
    if (p.busy) {
      var ct = procCT(p) * (p.reworking ? COST.reworkTimeK : 1);
      var prog = clamp(1 - p.busyLeft / Math.max(0.01, ct), 0, 1);
      c.fillStyle = p.reworking ? '#7b5cff' : '#12b981';
      roundRect(c, bx, by2, Math.max(bw * prog, 3), 5, 2.5); c.fill();
    }

    /* 状态文字 */
    c.font = '8.5px system-ui'; c.fillStyle = '#8aa0bb';
    var st = down ? '停机 ' + p.machine.down.toFixed(0) + 's'
           : p.blocked ? '阻塞'
           : p.reworking ? '返修'
           : p.busy ? '加工'
           : qn > 0 ? '等待' : '空闲';
    if (p.tighten > 0) st = '加严 ' + p.tighten.toFixed(0) + 's';
    c.fillStyle = down ? '#ef4444' : p.blocked ? '#f59e0b' : p.tighten > 0 ? '#7b5cff' : '#8aa0bb';
    c.fillText(st + ' · ' + p.cnt, g.x + g.w / 2, g.y + g.h * 0.87);

    /* 健康度小条 */
    var hh = p.machine.health;
    c.fillStyle = hh > 0.85 ? '#12b981' : hh > 0.68 ? '#f59e0b' : '#ef4444';
    c.fillRect(g.x + 4, g.y + g.h - 4, (g.w - 8) * clamp(hh, 0, 1), 2.5);

    /* 门标记 */
    if (isGate) {
      c.fillStyle = '#f0a500'; c.font = '700 8px system-ui';
      c.textAlign = 'left';
      c.fillText('GATE', g.x + 5, g.y + 8);
      c.textAlign = 'center';
    }

function roundRect(c, x, y, w, h, r) {
  if (w <= 0 || h <= 0) { c.beginPath(); return; }   /* 退化尺寸直接跳过，避免 arcTo 负半径抛错 */
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function clipTxt(c, s, maxW) {
  if (c.measureText(s).width <= maxW) return s;
  var t = s;
  while (t.length > 1 && c.measureText(t + '…').width > maxW) t = t.slice(0, -1);
  return t + '…';
}

/* 产线鼠标交互 */
function lineHit(mx, my) {
  for (var i = 0; i < LINE_GEO.length; i++) {
    var g = LINE_GEO[i];
    if (mx >= g.x && mx <= g.x + g.w && my >= g.y && my <= g.y + g.h) return i;
  }
  return -1;
}

function renderProcBar() {
  var box = $('procBar');
  if (!box || !G) return;
  if (box.childElementCount !== G.procs.length) {

      var p = G.procs[i], d = p.d;
      var chip = el('div', 'pchip' + (d.kind === 'gate' ? ' gate' : ''));
      chip.dataset.i = i;
      chip.innerHTML = '<div class="qn"></div><div class="dot"></div>' +
        '<div class="ic">' + d.icon + '</div>' +
        '<div class="nm">' + esc(d.short) + '</div>' +
        '<div class="st">—</div>';
      chip.onclick = (function (k) { return function () { selectProc(k); }; })(i);
      box.appendChild(chip);
    }
  }
  for (var j = 0; j < G.procs.length; j++) {
    var pp = G.procs[j], ch = box.children[j];
    ch.classList.toggle('sel', j === UI.sel);
    var dot = ch.querySelector('.dot');
    var down = pp.machine.down > 0;
    dot.style.background = down ? 'var(--bad)' : pp.blocked ? 'var(--warn)'
      : pp.busy ? 'var(--ok)' : pp.queue.length ? 'var(--acc)' : 'transparent';
    ch.querySelector('.qn').textContent = pp.queue.length || '';
    var stEl = ch.querySelector('.st');
    if (pp.d.kind === 'gate') {
      stEl.textContent = fmt(pp.thr, 1) + '·' + (SAMPLING[pp.cov] ? SAMPLING[pp.cov].label : '');
    } else {
      stEl.textContent = pp.lastVal === null ? '—' : fmt(pp.lastVal, 1);
    }
  }
}

function selectProc(i) {
  UI.sel = i;
  UI.curveKey = null;
  renderProcBar();
  renderParams();
}

function renderParams() {
  var box = $('paramBox'), head = $('paramHead');
  if (!box || !G) return;
  var p = G.procs[UI.sel], d = p.d;
  head.innerHTML = d.icon + ' ' + esc(d.name) +

/* ---------- 加工站面板 ---------- */
function renderProcPanel(box, p) {
  var d = p.d;
  var pred = predictProc(p);

  /* --- CTQ 预测头 --- */
  var head = el('div');
  var specTxt = (isFinite(d.lsl) ? d.lsl : '−∞') + ' ~ ' + (isFinite(d.usl) ? d.usl : '+∞');
  var need = G.lv.cpk;
  var cpkCol = pred && pred.cpk !== null
    ? (pred.cpk >= need ? 'var(--ok)' : pred.cpk >= need * 0.8 ? 'var(--warn)' : 'var(--bad)') : 'var(--ink3)';
  head.innerHTML =
    '<div class="kv big"><span>' + esc(d.ctqLabel) + ' 预测均值</span>' +
      '<b>' + (pred ? fmt(pred.mu, 2) : '—') + ' ' + esc(d.ctqUnit) + '</b></div>' +
    '<div class="kv"><span>规格 ' + specTxt + ' ' + esc(d.ctqUnit) + '</span>' +
      '<b>σ ' + (pred ? fmt(pred.sigma, 3) : '—') + '</b></div>' +
    '<div class="kv"><span>预估 CPK（需 ≥' + need.toFixed(2) + '）</span>' +
      '<b style="color:' + cpkCol + '">' + (pred && pred.cpk !== null ? fmt(pred.cpk, 2) : '—') + '</b></div>';

  /* --- 田口稳健性 --- */
  if (pred && pred.byParam.length) {

               : '敏感（设备漂移被放大）';
    rob.innerHTML = '<span class="tag ' + robTag + '">噪声传递 ' + pct(share, 0) + ' · ' + robTxt + '</span>';

    }

  /* --- 参数滑块 --- */
  if (d.params) {
    for (var i = 0; i < d.params.length; i++) {

        var row = el('div', 'prow');

        if (UI.curveKey === pr.k) lab.style.color = 'var(--acc)';

    (d.id === 'BOND'

  btns.appendChild(bPM);
  if (p.chart) {

    btns.appendChild(bRB);
  }
  if (d.id === 'BOND') {
    var bTS = el('button', 'btn sm', '🔪 换劈刀 ¥' + COST.toolCost);
    bTS.onclick = function () { doToolSwap(); renderParams(); };

  if (d.bom && d.bom.length) {

}

/* ============================================================
   曲线绘制 —— canvas 尚未进入 DOM 时宽度为 0，延后一帧再画
   ============================================================ */
function drawCurveLater(cv, sc, d) {
  requestAnimationFrame(function () { drawCurve(cv, sc, d); });
}
function prepCv(cv, fallbackW) {
  var dpr = window.devicePixelRatio || 1;
  var W = cv.clientWidth || fallbackW || 240, H = cv.clientHeight || 74;
  cv.width = W * dpr; cv.height = H * dpr;
  var c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, W, H);
  return { c: c, W: W, H: H };
}

/* 响应曲面 + 噪声传递斜率带 */
function drawCurve(cv, sc, d) {
  var q = prepCv(cv); var c = q.c, W = q.W, H = q.H;
  var pts = sc.pts, pr = sc.param;
  var x0 = 4, x1 = W - 4, y0 = 7, y1 = H - 11;

  var lo = Infinity, hi = -Infinity, slMax = 0;
  for (var i = 0; i < pts.length; i++) {
    if (pts[i].y < lo) lo = pts[i].y;
    if (pts[i].y > hi) hi = pts[i].y;
    if (pts[i].slope > slMax) slMax = pts[i].slope;
  }
  /* 把规格限纳入纵轴范围，玩家才能看见「离规格还有多远」 */
  var spec = d.lowerBetter ? d.usl : d.lsl;
  if (isFinite(spec)) { if (spec < lo) lo = spec; if (spec > hi) hi = spec; }
  if (hi - lo < 1e-9) hi = lo + 1;
  var padV = (hi - lo) * 0.12; lo -= padV; hi += padV;

  var X = function (v) { return x0 + (x1 - x0) * (v - pr.min) / Math.max(1e-9, pr.max - pr.min); };
  var Y = function (v) { return y1 - (y1 - y0) * (v - lo) / Math.max(1e-9, hi - lo); };

  /* 噪声传递斜率带（越厚 = 该点越不稳健） */
  if (slMax > 1e-9) {
    c.beginPath();
    for (var a = 0; a < pts.length; a++) {
      var yy = Y(pts[a].y), th = (pts[a].slope / slMax) * 13;
      if (a === 0) c.moveTo(X(pts[a].x), yy - th); else c.lineTo(X(pts[a].x), yy - th);
    }
    for (var b = pts.length - 1; b >= 0; b--) {
      var yy2 = Y(pts[b].y), th2 = (pts[b].slope / slMax) * 13;
      c.lineTo(X(pts[b].x), yy2 + th2);
    }
    c.closePath();
    c.fillStyle = 'rgba(245,158,11,.22)'; c.fill();
  }

  /* 规格限 */
  if (isFinite(spec)) {
    c.strokeStyle = 'rgba(239,68,68,.75)'; c.lineWidth = 1; c.setLineDash([3, 2]);
    c.beginPath(); c.moveTo(x0, Y(spec)); c.lineTo(x1, Y(spec)); c.stroke();
    c.setLineDash([]);
  }

  /* 响应曲线 */
  c.beginPath();
  for (var k = 0; k < pts.length; k++) {
    var px = X(pts[k].x), py = Y(pts[k].y);
    if (k === 0) c.moveTo(px, py); else c.lineTo(px, py);
  }
  c.strokeStyle = '#1e88ff'; c.lineWidth = 1.8; c.lineJoin = 'round'; c.stroke();

  /* 当前工作点 */
  var cx = X(sc.cur), curY = null;
  c.strokeStyle = 'rgba(18,35,59,.42)'; c.lineWidth = 1;
  c.beginPath(); c.moveTo(cx, y0); c.lineTo(cx, y1); c.stroke();
  for (var m = 0; m < pts.length - 1; m++) {
    if (sc.cur >= pts[m].x && sc.cur <= pts[m + 1].x) {
      var t = (sc.cur - pts[m].x) / Math.max(1e-9, pts[m + 1].x - pts[m].x);
      curY = pts[m].y + t * (pts[m + 1].y - pts[m].y);
      break;
    }
  }
  if (curY === null) curY = pts[pts.length - 1].y;
  c.fillStyle = '#12233b';
  c.beginPath(); c.arc(cx, Y(curY), 3.2, 0, 6.2832); c.fill();
  c.fillStyle = '#fff';
  c.beginPath(); c.arc(cx, Y(curY), 1.5, 0, 6.2832); c.fill();

  /* 驻点（斜率最小处）—— 田口稳健工作点 */
  var bestI = 0, bestS = Infinity;
  for (var n2 = 0; n2 < pts.length; n2++) if (pts[n2].slope < bestS) { bestS = pts[n2].slope; bestI = n2; }
  if (slMax > 1e-9 && bestS < slMax * 0.30) {
    var bx = X(pts[bestI].x);
    c.strokeStyle = 'rgba(18,185,129,.85)'; c.lineWidth = 1.4; c.setLineDash([2, 2]);
    c.beginPath(); c.moveTo(bx, y0); c.lineTo(bx, y1); c.stroke();
    c.setLineDash([]);
  }

  c.fillStyle = '#8aa0bb'; c.font = '8px system-ui'; c.textAlign = 'left';
  c.fillText(fmt(pr.min, 0), x0, H - 2);
  c.textAlign = 'right';
  c.fillText(fmt(pr.max, 0) + pr.u, x1, H - 2);
}

/* ---------- 检测门 α/β 面积图 ---------- */
function drawAlphaBetaLater(cv, pg, p) {
  requestAnimationFrame(function () { drawAlphaBeta(cv, pg, p); });
}
function drawAlphaBeta(cv, pg, p) {
  var q = prepCv(cv); var c = q.c, W = q.W, H = q.H;
  var d = p.d;
  var spec = d.lowerBetter ? d.usl : d.lsl;
  if (!isFinite(spec)) return;
  var mu = pg.mu, sd = Math.max(1e-6, pg.sd);
  var lo = Math.min(mu - 3.6 * sd, spec - sd, p.thr - sd);
  var hi = Math.max(mu + 3.6 * sd, spec + sd, p.thr + sd);
  var x0 = 4, x1 = W - 4, y0 = 10, y1 = H - 12;
  var X = function (v) { return x0 + (x1 - x0) * (v - lo) / Math.max(1e-9, hi - lo); };
  var pdf = function (v) { return Math.exp(-0.5 * Math.pow((v - mu) / sd, 2)); };
  var Y = function (v) { return y1 - (y1 - y0) * v; };

  var N = 140, xs = [];
  for (var i = 0; i <= N; i++) xs.push(lo + (hi - lo) * i / N);

  function fillRegion(from, to, color) {
    if (to <= from) return;
    c.beginPath(); c.moveTo(X(from), y1);
    for (var j = 0; j <= 60; j++) {
      var v = from + (to - from) * j / 60;
      c.lineTo(X(v), Y(pdf(v)));
    }
    c.lineTo(X(to), y1); c.closePath();
    c.fillStyle = color; c.fill();
  }
  /* 阈值比规格严 → 中间那条带子是过杀(α)；比规格松 → 是漏检(β) */
  if (d.lowerBetter) {
    if (p.thr < spec) fillRegion(p.thr, spec, 'rgba(239,68,68,.30)');
    else fillRegion(spec, p.thr, 'rgba(245,158,11,.32)');
  } else {
    if (p.thr > spec) fillRegion(spec, p.thr, 'rgba(239,68,68,.30)');
    else fillRegion(p.thr, spec, 'rgba(245,158,11,.32)');
  }

  c.beginPath();
  for (var k = 0; k <= N; k++) {
    var px = X(xs[k]), py = Y(pdf(xs[k]));
    if (k === 0) c.moveTo(px, py); else c.lineTo(px, py);
  }
  c.strokeStyle = '#1e88ff'; c.lineWidth = 1.7; c.stroke();

  /* GRR 展宽后的测量值分布 */
  if (pg.grr > 1e-9) {
    var sdm = Math.sqrt(sd * sd + pg.grr * pg.grr);
    c.beginPath();
    for (var m2 = 0; m2 <= N; m2++) {
      var pv2 = Math.exp(-0.5 * Math.pow((xs[m2] - mu) / sdm, 2)) * (sd / sdm);
      var px2 = X(xs[m2]), py2 = Y(pv2);
      if (m2 === 0) c.moveTo(px2, py2); else c.lineTo(px2, py2);
    }
    c.strokeStyle = 'rgba(123,92,255,.75)'; c.lineWidth = 1.2; c.setLineDash([3, 2]);
    c.stroke(); c.setLineDash([]);
  }

  c.strokeStyle = '#ef4444'; c.lineWidth = 1.4;
  c.beginPath(); c.moveTo(X(spec), y0 - 4); c.lineTo(X(spec), y1); c.stroke();
  c.strokeStyle = '#f0a500'; c.lineWidth = 1.6; c.setLineDash([4, 2]);
  c.beginPath(); c.moveTo(X(p.thr), y0 - 4); c.lineTo(X(p.thr), y1); c.stroke();
  c.setLineDash([]);

  c.font = '8px system-ui'; c.textAlign = 'center';
  c.fillStyle = '#ef4444'; c.fillText('规格', X(spec), H - 2);
  c.fillStyle = '#c07f00'; c.fillText('阈值', X(p.thr), 8);
  c.textAlign = 'left'; c.fillStyle = '#7b5cff';
  c.fillText('紫虚线 = 含量具 GRR 的测量分布', x0 + 2, 8);
}

/* ---------- 阈值扫描：过杀成本 vs 逃逸索赔，找 U 型谷底 ---------- */
function drawThrScanLater(cv, p, pg) {
  requestAnimationFrame(function () { drawThrScan(cv, p, pg); });
}
function drawThrScan(cv, p, pg) {
  var q = prepCv(cv); var c = q.c, W = q.W, H = q.H;
  var d = p.d, g = d.gate;
  var spec = d.lowerBetter ? d.usl : d.lsl;
  if (!isFinite(spec)) return;
  var pr = PRICE[G.lv.grade];
  var cov = SAMPLING[p.cov] ? SAMPLING[p.cov].rate : 0;
  var unitVal = bomUnitCost() + COST.vaPerPiece * 0.6;   // 过杀一件损失的价值
  var claim = pr.unit * pr.claimMult * G.claimK;         // 逃逸一件的索赔

  var N = 60, pts = [], mn = Infinity, mx = -Infinity;
  for (var i = 0; i <= N; i++) {
    var thr = g.thrMin + (g.thrMax - g.thrMin) * i / N;
    var ab = V2PHYS.alphaBeta(pg.mu, pg.sd, spec, thr, d.lowerBetter);
    var over = ab.alpha * cov;
    /* 未抽到的部分按一半概率漏出；再乘真实不良基线 6% 折算成索赔期望 */
    var escp = clamp(ab.beta * cov + (1 - cov) * 0.5, 0, 1) * 0.06;
    var cost = over * unitVal + escp * claim + g.unitCost * cov;
    pts.push({ thr: thr, cost: cost });
    if (cost < mn) mn = cost;
    if (cost > mx) mx = cost;
  }
  if (mx - mn < 1e-9) mx = mn + 1;
  var x0 = 4, x1 = W - 4, y0 = 12, y1 = H - 11;
  var X = function (v) { return x0 + (x1 - x0) * (v - g.thrMin) / Math.max(1e-9, g.thrMax - g.thrMin); };
  var Y = function (v) { return y1 - (y1 - y0) * (v - mn) / (mx - mn); };

  c.beginPath();
  for (var k = 0; k < pts.length; k++) {
    var px = X(pts[k].thr), py = Y(pts[k].cost);
    if (k === 0) c.moveTo(px, py); else c.lineTo(px, py);
  }
  c.strokeStyle = '#7b5cff'; c.lineWidth = 1.8; c.stroke();

  var bi = 0;
  for (var m = 1; m < pts.length; m++) if (pts[m].cost < pts[bi].cost) bi = m;
  c.strokeStyle = 'rgba(18,185,129,.9)'; c.lineWidth = 1.3; c.setLineDash([2, 2]);
  c.beginPath(); c.moveTo(X(pts[bi].thr), y0); c.lineTo(X(pts[bi].thr), y1); c.stroke();
  c.setLineDash([]);

  c.strokeStyle = '#f0a500'; c.lineWidth = 1.6;
  c.beginPath(); c.moveTo(X(p.thr), y0); c.lineTo(X(p.thr), y1); c.stroke();

  c.font = '8px system-ui'; c.textAlign = 'center';
  c.fillStyle = '#0ea371';
  c.fillText('经济最优 ' + fmt(pts[bi].thr, 1), X(pts[bi].thr), H - 2);
  c.textAlign = 'left'; c.fillStyle = '#8aa0bb';
  c.fillText('纵轴 = 单件质量代价（过杀 + 索赔 + 检测费）', x0 + 2, 8);
}
