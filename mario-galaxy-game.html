     p5.gravity === -1 && Math.abs(p5.y - 64) < 1.5 && p5.onGround,
     `gravity=${p5.gravity} y=${p5.y.toFixed(1)} onGround=${p5.onGround}`);

  // T6 踩踏敌人（选一个上方无平台、下方是实地的空列 x=22）
  G.start(0, { lives: 3 });
  G.clearEnemies(); G.clearMovers();
  const e6 = G.addEnemy(22 * TILE, 15 * TILE + 8);
  const lives6 = G.game.lives;
  G.setPlayer({ x: 22 * TILE + 4, y: 12 * TILE, gravity: 1, vy: 6, invuln: 0 });
  let stomped = false;
  for (let i = 0; i < 40 && !stomped; i++) { G.advance(1); if (e6.dead) stomped = true; }
  ok('T6 从上方落下可踩扁敌人且不掉命',
     stomped && G.game.lives === lives6 && G.game.player.vy < 0,
     `dead=${e6.dead} lives=${G.game.lives} vy=${G.game.player.vy.toFixed(1)}`);

  // T7 侧面撞敌人 → 掉命
  G.start(0, { lives: 3 });
  G.clearEnemies(); G.clearMovers();
  const e7 = G.addEnemy(22 * TILE + 40, 15 * TILE + 8);
  e7.vx = 0;
  G.setPlayer({ x: 22 * TILE + 4, y: 15 * TILE + 4, gravity: 1, vy: 0, invuln: 0 });
  G.key('right', true); G.advance(45); G.key('right', false);
  ok('T7 侧面撞到敌人会损失生命',
     G.game.lives === 2 && (G.game.state === 'dying' || G.game.state === 'gameover'),
     `lives=${G.game.lives} state=${G.game.state}`);

  // T8 尖刺致死
  G.start(0, { lives: 3 });
  G.clearMovers();
  G.setPlayer({ x: 36 * TILE + 2, y: 14 * TILE + 4, gravity: 1, vy: 4, invuln: 0 });
  G.advance(40);
  ok('T8 触碰尖刺会损失生命', G.game.lives === 2, `lives=${G.game.lives} state=${G.game.state}`);

  // T9 掉出关卡致死（站在 18-20 深坑上方）
  G.start(0, { lives: 3 });
  G.clearMovers();
  G.setPlayer({ x: 19 * TILE + 6, y: 15 * TILE, gravity: 1, vy: 2, invuln: 0 });
  G.advance(120);
  ok('T9 掉进深坑会损失生命', G.game.lives === 2, `lives=${G.game.lives} state=${G.game.state}`);

  // T10 收集星星币
  G.start(0, { lives: 3 });
  G.clearMovers();
  const sc10 = G.game.score, b10 = G.game.bits;
  G.setPlayer({ x: 8 * TILE + 8, y: 12 * TILE + 8, gravity: 1, vy: 0, invuln: 999 });
  G.advance(4);
  ok('T10 收集星星币计数与得分增加',
     G.game.bits === b10 + 1 && G.game.score === sc10 + 100,
     `bits ${b10}→${G.game.bits} score ${sc10}→${G.game.score}`);

  // T11 力量星 → 过关
  // 动态定位力量星：关卡布局调整（如把悬空的力量星下移到主路径）后测试不会失效
  const findStar = () => {
    for (let y = 0; y < G.cfg.ROWS; y++)
      for (let x = 0; x < G.game.w; x++) if (G.game.tiles[y][x] === 'S') return { x, y };
    return null;
  };
  G.start(0, { lives: 3 });
  G.game.totalStars = 0;
  const star11 = findStar();
  G.setPlayer({ x: star11.x * TILE + 8, y: star11.y * TILE + 2, gravity: 1, vy: 0, invuln: 999 });
  G.advance(4);
  ok('T11 触碰力量星进入过关流程',
     G.game.state === 'clear' && G.game.totalStars === 1,
     `state=${G.game.state} stars=${G.game.totalStars}`);

  // T12 移动平台承载（取一台水平移动平台）
  G.start(0, { lives: 3 });
  const m = G.movers().filter(q => q.kind === 'h')[0];
  let carryOk = false, info12 = 'no mover';
  if (m) {
    G.setPlayer({ x: m.x + 30, y: m.y - 30, gravity: 1, vx: 0, vy: 1, invuln: 999 });
    G.advance(6);
    const before = G.game.player.x, mBefore = m.x;
    G.advance(30);
    const dP = G.game.player.x - before, dM = m.x - mBefore;
    carryOk = Math.abs(dP) > 3 && Math.sign(dP) === Math.sign(dM) && Math.abs(dP - dM) < 6;
    info12 = `玩家位移 ${dP.toFixed(1)} / 平台位移 ${dM.toFixed(1)}`;
  }
  ok('T12 站在移动平台上会被一起带走', carryOk, info12);

  // T13 生命耗尽 → gameover
  G.start(0, { lives: 1 });
  G.setPlayer({ x: 19 * TILE + 6, y: 15 * TILE, gravity: 1, vy: 2, invuln: 0 });
  G.advance(200);
  ok('T13 生命耗尽进入 GAME OVER', G.game.state === 'gameover', `state=${G.game.state} lives=${G.game.lives}`);

  // T14 通关全部 6 关 → win
  let winOk = false, info14 = '';
  try {
    const N = G.LEVELS.length;
    G.start(0, { lives: 3 });
    for (let i = 0; i < N; i++) {
      G.game.totalStars = i;
      G.start(i, { lives: 3 });
      // 直接传送到力量星位置
      const L = G.LEVELS[i];
      let sx = -1, sy = -1;
      for (let y = 0; y < ROWS; y++) { const c = L.rows[y].indexOf('S'); if (c >= 0) { sx = c; sy = y; break; } }
      G.setPlayer({ x: sx * TILE + 8, y: sy * TILE + 2, gravity: 1, vy: 0, invuln: 999 });
      G.advance(4);
      if (i < N - 1 && G.game.state !== 'clear') { info14 = `第${i + 1}关未过关(${G.game.state})`; break; }
    }
    winOk = G.game.state === 'win';
    if (!info14) info14 = `state=${G.game.state}`;
  } catch (e) { info14 = 'EX ' + e.message; }
  ok('T14 连续通过全部 6 关触发通关结算', winOk, info14);

  // T15 长时间运行稳定性（无 NaN / 无异常）
  let stable = true, info15 = '';
  try {
    G.start(2, { lives: 99 });
    const seq = ['right', 'jump', 'flip', 'spin', 'left'];
    for (let i = 0; i < 2400; i++) {
      const k = seq[Math.floor(i / 45) % seq.length];
      if (i % 45 === 0) G.key(k, true);
      if (i % 45 === 22) G.key(k, false);
      G.advance(1);
      const pp = G.game.player;
      if (!isFinite(pp.x) || !isFinite(pp.y) || !isFinite(pp.vx) || !isFinite(pp.vy)) { stable = false; info15 = `NaN @frame ${i}`; break; }
    }
  } catch (e) { stable = false; info15 = 'EX ' + e.message; }
  ok('T15 连续 2400 帧随机操作无异常、无 NaN', stable, info15);

  // T16 重力板自动翻转
  G.start(0, { lives: 3 });
  G.clearMovers();
  G.setPlayer({ x: 30 * TILE + 6, y: 15 * TILE, gravity: 1, vy: 2, invuln: 999 });
  G.advance(30);
  ok('T16 踏上重力板会自动翻转重力', G.game.player.gravity === -1, `gravity=${G.game.player.gravity}`);

  // T17 可玩性：脚本化“玩家”自动试玩第一关，应能跨越深坑 / 天花板路段 / 尖刺
  let autoMaxX = 0, autoInfo = '';
  try {
    __seed = 20260903;                                   // 重置随机种子，让自动试玩结果可复现（不受前面用例消耗影响）
    G.start(0, { lives: 5 });
    let jumpHold = 0, spinCd = 0, lastLives = G.game.lives;
    const deaths = [];
    for (let i = 0; i < 3000; i++) {
      const pp = G.game.player, gd = pp.gravity;
      G.key('right', true);
      const footTy = Math.floor((gd === 1 ? pp.y + pp.h + 2 : pp.y - 2) / TILE);
      const aheadX = Math.floor((pp.x + pp.w + 16) / TILE);
      const bodyTy = Math.floor((pp.y + pp.h / 2) / TILE);
      const gapAhead = !G.isSolid(aheadX, footTy);
      const wallAhead = G.isSolid(Math.floor((pp.x + pp.w + 8) / TILE), bodyTy);
      const spikeAhead = G.tileAt(aheadX, footTy) === '^' || G.tileAt(aheadX, footTy - gd) === '^'
                      || G.tileAt(aheadX + 1, footTy) === '^' || G.tileAt(aheadX + 1, footTy - gd) === '^';
      let enemyNear = false;
      for (const e of G.game.enemies) if (!e.dead && Math.abs(e.x - pp.x) < 48 && Math.abs(e.y - pp.y) < 44) enemyNear = true;
      if (spinCd > 0) spinCd--;
      G.key('spin', enemyNear && spinCd <= 0);
      if (enemyNear && spinCd <= 0) spinCd = 30;
      if ((gapAhead || wallAhead || spikeAhead) && pp.onGround) jumpHold = 20;
      if (jumpHold > 0) { G.key('jump', true); jumpHold--; } else G.key('jump', false);
      const lvBefore = G.game.lives;
      G.advance(1);
      if (G.game.lives < lvBefore) {
        const f = G.game.floats[G.game.floats.length - 1];
        deaths.push(`x=${pp.x.toFixed(0)} g=${pp.gravity} ${f ? f.t : ''}`);
      }
      if (pp.x > autoMaxX) autoMaxX = pp.x;
    }
    autoInfo = `最远推进 x=${autoMaxX.toFixed(0)}（关卡宽 ${G.LEVELS[0].w * TILE}）｜剩余生命 ${G.game.lives}｜星星币 ${G.game.bits}｜死亡: ${deaths.join(' / ') || '无'}`;
  } catch (e) { autoInfo = 'EX ' + e.message; }
  ok('T17 脚本玩家自动试玩：能跨坑/过天花板/躲尖刺并大幅推进',
     autoMaxX > 1450 && G.game.lives > 0, autoInfo);

  // T18 每关视觉主题互不相同
  const sigs = [];
  let themeOk = true, bgOk = true, visOk = true, info18 = '';
  try {
    for (let i = 0; i < G.LEVELS.length; i++) {
      G.start(i, { lives: 3 });
      if (G.game.theme !== G.THEMES[i]) themeOk = false;
      const c = G.bgFor(i);
      const d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
      let s = 0;
      for (let k = 0; k < d.length; k += 4 * 1009) s = (s * 31 + d[k] + d[k + 1] * 3 + d[k + 2] * 7) >>> 0;
      sigs.push(s);
    }
    if (new Set(sigs).size !== sigs.length) bgOk = false;
    const T = G.THEMES;
    if (new Set(T.map(t => t.rock.join())).size !== T.length) visOk = false;
    if (new Set(T.map(t => t.plat.join())).size !== T.length) visOk = false;
    if (new Set(T.map(t => t.planets[0].c1)).size !== T.length) visOk = false;
    info18 = `背景指纹 ${sigs.join(' / ')}`;
  } catch (e) { themeOk = bgOk = visOk = false; info18 = 'EX ' + e.message; }
  ok('T18 六关视觉主题各不相同（背景/星球/地块配色）', themeOk && bgOk && visOk, info18);

  // T19 每关切换对应 BGM
  let bgmOk = true, info19 = [];
  try {
    const N = G.LEVELS.length;
    for (let i = 0; i < N; i++) {
      G.start(i, { lives: 3 });
      if (G.Music.current() !== i) bgmOk = false;
      info19.push(`${G.THEMES[i].bpm}bpm`);
    }
    const uniqBpm = new Set(G.THEMES.map(t => t.bpm)).size;
    const uniqChord = new Set(G.THEMES.map(t => JSON.stringify(t.chords))).size;
    const uniqBass = new Set(G.THEMES.map(t => t.bassWave + t.leadWave)).size;
    if (uniqBpm !== N || uniqChord !== N || uniqBass !== N) bgmOk = false;
    info19.push(`速度/和弦/音色唯一性 ${uniqBpm}/${uniqChord}/${uniqBass}`);
  } catch (e) { bgmOk = false; info19.push('EX ' + e.message); }
  ok('T19 每关切换各自 BGM（速度/和弦/音色均不同）', bgmOk, info19.join(' ｜ '));

  // T22 每关环境天气层各不相同，且与关卡环境匹配
  let ambOk = true, ambInfo = [];
  try {
    const kinds = G.THEMES.map(t => t.ambient && t.ambient.kind);
    if (new Set(kinds).size !== G.THEMES.length || kinds.some(k => !k)) ambOk = false;
    G.THEMES.forEach((t, i) => {
      ambInfo.push(`${t.name}:${t.ambient.kind}`);
      if (t.ambient.n < 40 || t.ambient.size <= 0) ambOk = false;
    });
    // 环境 → 音乐性格映射：冰原最慢、熔炉最快；雨林摇摆最强；冰原/深海有高八度铃声；雷暴有闷雷
    const [ICE, FIRE, JUNGLE, DESERT, SEA, STORM] = G.THEMES;
    if (!(ICE.bpm < JUNGLE.bpm && JUNGLE.bpm < FIRE.bpm)) ambOk = false;
    if (!(JUNGLE.swing > FIRE.swing && FIRE.swing > ICE.swing)) ambOk = false;
    if (!(ICE.bell && !FIRE.bell && JUNGLE.bell && DESERT.bell && SEA.bell && !STORM.bell)) ambOk = false;
    if (!(FIRE.tom && STORM.tom && !ICE.tom)) ambOk = false;
    if (!(ICE.leadOct > 0 && SEA.leadOct > 0 && FIRE.leadOct === 0 && JUNGLE.leadOct === 0)) ambOk = false;
    if (!(STORM.thunder && !FIRE.thunder && !DESERT.thunder)) ambOk = false;
    if (STORM.bpm <= FIRE.bpm || SEA.bpm >= ICE.bpm) ambOk = false;   // 雷暴最快、深海最慢
    ambInfo.push(`bpm ${ICE.bpm}/${SEA.bpm}/${JUNGLE.bpm}/${DESERT.bpm}/${FIRE.bpm}/${STORM.bpm}`);
  } catch (e) { ambOk = false; ambInfo.push('EX ' + e.message); }
  ok('T22 每关环境天气层 + BGM 性格与关卡环境匹配', ambOk, ambInfo.join(' ｜ '));

  // T23 天气层真的被绘制，且逐帧在运动
  let animOk = true, animInfo = [];
  try {
    for (let i = 0; i < G.LEVELS.length; i++) {
      G.start(i, { lives: 3 });
      const a1 = G.ambientProbe(120), a2 = G.ambientProbe(160);
      if (a1.n < 120 || a2.n < 120) animOk = false;          // 确实画出了粒子
      if (a1.sig === a2.sig) animOk = false;                  // 位置/透明度确实在变
      animInfo.push(`${G.THEMES[i].ambient.kind} 覆盖${a1.n}px`);
    }
  } catch (e) { animOk = false; animInfo.push('EX ' + e.message); }
  ok('T23 天气层已绘制且逐帧运动（雪/火星/花粉/沙/气泡/雨）', animOk, animInfo.join(' ｜ '));

  // T24 难度递进：关卡变长、深坑增多、总威胁度（敌+刺+平台）递增
  let diffOk = true, diffInfo = [];
  try {
    const stats = G.LEVELS.map(L => {
      const flat = L.rows.join('');
      return {
        w: L.w,
        pits: (L.rows[16].match(/\./g) || []).length,
        enemies: (flat.match(/G/g) || []).length,
        spikes: (flat.match(/\^/g) || []).length,
        movers: (flat.match(/[MV]/g) || []).length,
        ceil: (flat.match(/F/g) || []).length,
        hazard: 0
      };
    });
    stats.forEach(s => { s.hazard = s.enemies + s.spikes + s.movers; });
    for (let i = 1; i < stats.length; i++) {
      const a = stats[i - 1], b = stats[i];
      if (!(b.w > a.w)) diffOk = false;             // 关卡越来越长
      if (!(b.pits > a.pits)) diffOk = false;       // 深坑越来越多
      if (!(b.enemies > a.enemies)) diffOk = false; // 敌人越来越多
      if (!(b.hazard > a.hazard)) diffOk = false;   // 总威胁度（敌+刺+平台）递增
    }
    diffInfo = stats.map(s => `${s.w}w/${s.pits}坑/${s.enemies}敌/${s.spikes}刺/${s.movers}台`);
  } catch (e) { diffOk = false; diffInfo = ['EX ' + e.message]; }
  ok('T24 关卡难度逐关递进（更宽/更多坑·敌·总威胁度）', diffOk, diffInfo.join(' ｜ '));

  // T25 彩蛋：隐藏彩虹星可收集，且计入全局计数
  let rbOk = false, rbInfo = '';
  try {
    G.game.rainbow = 0;
    G.start(0, { lives: 3 });
    const sc0 = G.game.score;
    // 第一关彩虹星在 (20,1)，需翻转重力贴天花板
    G.setPlayer({ x: 20 * TILE + 6, y: 64, gravity: -1, vy: 0, invuln: 0 });
    G.advance(2);
    rbOk = G.game.rainbow === 1 && G.game.score === sc0 + 1000 && G.game.player.rainbow > 0;
    rbInfo = `rainbow=${G.game.rainbow}/${G.RAINBOW_TOTAL} score+${G.game.score - sc0} 拖尾帧=${G.game.player.rainbow}`;
  } catch (e) { rbInfo = 'EX ' + e.message; }
  ok('T25 彩蛋：隐藏彩虹星可收集（+1000 分、无敌、彩虹拖尾）', rbOk, rbInfo);

  // T26 彩蛋：Konami 秘技 ↑↑↓↓←→←→BA
  let konOk = false, konInfo = '';
  try {
    G.start(1, { lives: 3 });
    const lv0 = G.game.lives, sc0 = G.game.score;
    let triggered = false;
    for (const c of G.KONAMI) triggered = G.feedKonami(c) || triggered;
    konOk = triggered && G.game.lives === lv0 + 3 && G.game.score === sc0 + 3000 && G.game.player.rainbow > 0;
    konInfo = `生命 ${lv0}→${G.game.lives} 得分 ${sc0}→${G.game.score}`;
  } catch (e) { konInfo = 'EX ' + e.message; }
  ok('T26 彩蛋：Konami 秘技触发（生命 +3 / 得分 +3000 / 彩虹拖尾）', konOk, konInfo);

  // T20 过关 / 失败时停止 BGM
  G.start(0, { lives: 3 });
  const star20 = findStar();
  G.setPlayer({ x: star20.x * TILE + 8, y: star20.y * TILE + 2, gravity: 1, vy: 0, invuln: 999 });
  G.advance(4);
  const stopOnClear = G.game.state === 'clear' && G.Music.current() === -1;
  G.start(0, { lives: 1 });
  G.setPlayer({ x: 19 * TILE + 6, y: 15 * TILE, gravity: 1, vy: 2, invuln: 0 });
  G.advance(200);
  const stopOnOver = G.game.state === 'gameover' && G.Music.current() === -1;
  ok('T20 过关与失败时背景音乐停止', stopOnClear && stopOnOver,
     `clear=${stopOnClear} gameover=${stopOnOver}`);

  // T21 M 键开关音乐
  G.start(1, { lives: 3 });
  const on1 = G.Music.isOn();
  G.Music.toggle();
  const on2 = G.Music.isOn();
  G.Music.toggle();
  const on3 = G.Music.isOn();
  ok('T21 可开关背景音乐且状态可恢复', on1 === true && on2 === false && on3 === true,
     `${on1} → ${on2} → ${on3}`);

  const pass = R.filter(r => r.pass).length;
  window.__TEST_RESULT = { pass, fail: R.length - pass, total: R.length, results: R };
  return window.__TEST_RESULT;
}

// ---------------- 启动 ----------------
function boot() {
  // 首屏必须先算一次画布尺寸，否则 canvas 会一直停在 HTML 里的 960×544，
  // 在 1080p / 2K / 4K 上都只占屏幕一小块（表现为「画面非常小」）
  resize();
  // 首帧布局可能还没稳定（字体加载、工具栏收起等），再兜底校正两轮
  requestAnimationFrame(() => { resize(); setTimeout(resize, 120); });

  const params = new URLSearchParams(location.search);
  if (params.get('test') === '1') {
    game.manual = true;
    const panel = document.getElementById('testPanel');
    const out = document.getElementById('testOut');
    panel.classList.remove('hidden');
    let res;
    try { res = runSelfTest(); }
    catch (e) { res = { pass: 0, fail: 1, total: 1, results: [{ name: '自检崩溃', pass: false, info: e.message + '\n' + e.stack }] }; window.__TEST_RESULT = res; }
    let html = `<h2>自检结果：${res.pass} / ${res.total} 通过${res.fail ? `（失败 ${res.fail}）` : ' ✅ 全部通过'}</h2>`;
    res.results.forEach((r, i) => {
      html += `<div class="${r.pass ? 'tp' : 'tf'}">[${r.pass ? 'PASS' : 'FAIL'}] ${String(i + 1).padStart(2, '0')} ${r.name}</div>`;
      if (r.info) html += `<div class="ti">      ↳ ${r.info}</div>`;
    });
    out.innerHTML = html;
    return;
  }
  game.player = makePlayer(64, 400);
  game.theme = THEMES[0]; game.levelIdx = 0; game.intro = 0;
  game.tiles = LEVELS[0].rows.map(r => r.split(''));
  game.w = LEVELS[0].w; game.name = LEVELS[0].name;
  showTitle();

  // 快速预览最终结算画面（含双角色庆祝动画）：直接打开 xxx.html#win
  if (location.hash === '#win') {
    game.totalStars = LEVELS.length; game.rainbow = RAINBOW_TOTAL;
    game.score = 35460; game.lives = 1;
    setTimeout(() => { game.levelIdx = LEVELS.length - 1; clearLevel(); }, 200);
  }

  requestAnimationFrame(frame);
}
boot();

})();
</script>
